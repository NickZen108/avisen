<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kronikør – Morgentidende</title><link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Source+Serif+4:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../account-ui.css"></head><body class="account-shell"><header class="account-top"><div class="account-top-inner"><a class="account-brand" href="../">Morgentidende</a><span>Kronikør</span></div></header><main class="account-main"><section class="account-card wide"><h1>Skriv kronik</h1><p class="lead">Et enkelt skrivebord til at skrive, planlægge og indsende en kronik. Udgivelse kræver redaktionel godkendelse.</p><form class="account-form" id="column-form"><div class="account-grid"><div><label for="title">Overskrift</label><input id="title" name="title" maxlength="180" required placeholder="Skriv en præcis, stærk overskrift"></div><div><label for="category">Kategori</label><select id="category" name="category"><option>Danmark</option><option>Udland</option><option>Politik</option><option>Penge</option><option>Krimi</option><option>Videnskab & teknologi</option><option>Sundhed</option><option>Kultur & medier</option><option>Sport</option><option>Liv</option></select></div></div><div class="hero-choice"><div><label for="hero">Hero-billede</label><input id="hero" name="hero" type="file" accept="image/jpeg,image/png,image/webp"></div><button class="account-button secondary" type="button" id="remove-hero">Fjern</button></div><div><label for="standfirst">Manchet</label><textarea id="standfirst" name="standfirst" style="min-height:110px" placeholder="Kort introduktion til kronikken"></textarea></div><div><label for="body">Kronik</label><textarea id="body" name="body" required placeholder="Skriv kronikken her…"></textarea></div><div class="schedule-row"><div><label for="publish-date">Ønsket udgivelsesdato</label><input id="publish-date" name="publish_date" type="date"></div><div><label for="publish-time">Ønsket tidspunkt</label><input id="publish-time" name="publish_time" type="time"></div></div><div class="account-actions"><button class="account-button secondary" type="button" id="save-draft">Gem kladde</button><button class="account-button" type="submit">Send til redaktionen</button></div><p class="account-status" id="column-status">Kladder kan gemmes lokalt nu. Indsendelse aktiveres, når login-backenden er koblet på.</p></form></section></main><script>(()=>{const form=document.getElementById('column-form'),status=document.getElementById('column-status'),key='morgentidende-kronik-draft';const fields=['title','category','standfirst','body','publish-date','publish-time'];try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved)for(const id of fields)if(saved[id]!=null)document.getElementById(id).value=saved[id]}catch(_){}document.getElementById('save-draft').onclick=()=>{const d={};for(const id of fields)d[id]=document.getElementById(id).value;localStorage.setItem(key,JSON.stringify(d));status.textContent='Kladde gemt på denne enhed.'};document.getElementById('remove-hero').onclick=()=>{document.getElementById('hero').value=''};form.addEventListener('submit',e=>{e.preventDefault();status.textContent='Indsendelse er endnu ikke aktiveret. Auth/database skal kobles på først.'})})();</script></body></html>
