<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Planeternes afstand fra Solen</title><desc id="d">Pædagogisk grafik med de otte planeters gennemsnitlige afstand fra Solen i astronomiske enheder.</desc><defs><style>.h{font:700 36px Arial,sans-serif;fill:#15253b}.sh{font:600 22px Arial,sans-serif;fill:#15253b}.p{font:18px Arial,sans-serif;fill:#34495e}.v{font:700 18px Arial,sans-serif;fill:#334b67}.n{font:16px Arial,sans-serif;fill:#5b6570}</style><linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd84a"/><stop offset="1" stop-color="#f08a24"/></linearGradient></defs><rect width="1200" height="760" fill="#f7f2e8"/><text x="55" y="62" class="h">Planeternes afstand fra Solen</text><text x="55" y="98" class="p">AU står for astronomisk enhed. 1 AU = Jordens gennemsnitlige afstand fra Solen = ca. 149,6 millioner km.</text><circle cx="95" cy="365" r="78" fill="url(#sun)" stroke="#e8a52b" stroke-width="5"/><text x="63" y="470" class="sh">Solen</text><line x1="180" y1="410" x2="1140" y2="410" stroke="#263238" stroke-width="4"/><path d="M1140 410 l-18 -10 v20 z" fill="#263238"/><g stroke="#7b8790" stroke-dasharray="5 5"><line x1="250" y1="300" x2="250" y2="410"/><line x1="345" y1="285" x2="345" y2="410"/><line x1="445" y1="265" x2="445" y2="410"/><line x1="555" y1="275" x2="555" y2="410"/><line x1="700" y1="235" x2="700" y2="410"/><line x1="835" y1="235" x2="835" y2="410"/><line x1="965" y1="250" x2="965" y2="410"/><line x1="1080" y1="245" x2="1080" y2="410"/></g><circle cx="250" cy="335" r="16" fill="#9b9b93" stroke="#666"/><circle cx="345" cy="325" r="25" fill="#d8b36c" stroke="#a77e3e"/><circle cx="445" cy="310" r="28" fill="#4b8fc8" stroke="#2f648e"/><path d="M426 300 q18 -18 36 0 q-12 8 -6 22 q-25 13 -38 -5z" fill="#65a66f" opacity=".9"/><circle cx="555" cy="320" r="22" fill="#c45d39" stroke="#8e3e27"/><circle cx="700" cy="295" r="45" fill="#c7a477" stroke="#8e7455"/><path d="M662 280 h76 M658 295 h84 M665 310 h70" stroke="#8d6f56" stroke-width="4" opacity=".65"/><circle cx="835" cy="300" r="36" fill="#d7c08b" stroke="#988255"/><ellipse cx="835" cy="300" rx="62" ry="14" fill="none" stroke="#9a8156" stroke-width="7" transform="rotate(-16 835 300)"/><circle cx="965" cy="305" r="31" fill="#80c8d3" stroke="#4a9aa6"/><circle cx="1080" cy="300" r="32" fill="#3c68bb" stroke="#274b8a"/><g text-anchor="middle"><text x="250" y="205" class="sh">Merkur</text><text x="250" y="230" class="v">0,39 AU</text><text x="345" y="180" class="sh">Venus</text><text x="345" y="205" class="v">0,72 AU</text><text x="445" y="155" class="sh">Jorden</text><text x="445" y="180" class="v">1,00 AU</text><text x="555" y="180" class="sh">Mars</text><text x="555" y="205" class="v">1,52 AU</text><text x="700" y="135" class="sh">Jupiter</text><text x="700" y="160" class="v">5,20 AU</text><text x="835" y="135" class="sh">Saturn</text><text x="835" y="160" class="v">9,58 AU</text><text x="965" y="155" class="sh">Uranus</text><text x="965" y="180" class="v">19,2 AU</text><text x="1080" y="145" class="sh">Neptun</text><text x="1080" y="170" class="v">30,1 AU</text></g><g text-anchor="middle" class="n"><text x="250" y="445">0,39</text><text x="345" y="445">0,72</text><text x="445" y="445">1,00</text><text x="555" y="445">1,52</text><text x="700" y="445">5,20</text><text x="835" y="445">9,58</text><text x="965" y="445">19,2</text><text x="1080" y="445">30,1 AU</text></g><rect x="75" y="515" width="480" height="120" rx="18" fill="#edf5fb" stroke="#8fb5d2" stroke-width="2"/><text x="105" y="555" class="sh">Hvorfor bruge AU?</text><text x="105" y="588" class="p">Kilometertal bliver hurtigt enorme. AU gør det lettere at</text><text x="105" y="615" class="p">sammenligne afstande: Jorden er 1 AU, Jupiter ca. 5,2 AU.</text><rect x="620" y="515" width="500" height="120" rx="18" fill="#f1f5e9" stroke="#a9bd8d" stroke-width="2"/><text x="650" y="555" class="sh">Hvad betyder tallene?</text><text x="650" y="588" class="p">De er gennemsnitlige afstande. Planeterne bevæger sig i</text><text x="650" y="615" class="p">elliptiske baner, så den faktiske afstand ændrer sig undervejs.</text><text x="75" y="700" class="n">Illustration: Morgentidende · planetstørrelser og indbyrdes mellemrum er ikke målfast.</text></svg>