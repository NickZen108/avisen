<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" role="img" aria-labelledby="title desc">
<title id="title">Planeternes afstand fra Solen målt i astronomiske enheder</title>
<desc id="desc">En astronomisk enhed, AU, er Jordens gennemsnitlige afstand fra Solen. Grafikken viser de indre planeter på en skala til 2 AU og de ydre planeter på en skala til 31 AU.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f2eee5"/></linearGradient>
  <style>
    .title{font:700 42px Arial,sans-serif;fill:#14243a}.sub{font:26px Arial,sans-serif;fill:#33485d}.head{font:700 31px Arial,sans-serif;fill:#1e2a38}.label{font:700 27px Arial,sans-serif;fill:#1e2a38}.num{font:25px Arial,sans-serif;fill:#3d5270}.note{font:24px Arial,sans-serif;fill:#4b4b48}
  </style>
</defs>
<rect width="900" height="1080" fill="url(#bg)"/>
<text x="45" y="62" class="title">Planeternes afstand fra Solen</text>
<rect x="45" y="92" width="810" height="112" rx="20" fill="#e8f1f8" stroke="#bfd1df" stroke-width="3"/>
<text x="72" y="136" class="head">1 AU = Jordens afstand til Solen</text>
<text x="72" y="178" class="sub">ca. 149,6 millioner kilometer</text>

<!-- Inner planets -->
<text x="55" y="260" class="head">De indre planeter</text>
<text x="55" y="294" class="sub">Her er skalaen 0–2 AU, så forskellene kan ses.</text>
<line x1="95" y1="365" x2="805" y2="365" stroke="#25384d" stroke-width="5"/>
<g stroke="#8996a3" stroke-width="3"><line x1="95" y1="350" x2="95" y2="385"/><line x1="450" y1="350" x2="450" y2="385"/><line x1="805" y1="350" x2="805" y2="385"/></g>
<text x="86" y="420" class="num">0</text><text x="430" y="420" class="num">1 AU</text><text x="775" y="420" class="num">2 AU</text>

<!-- inner markers proportional on 0-2 AU scale -->
<g>
  <circle cx="233" cy="365" r="19" fill="#a9a9a6" stroke="#656565" stroke-width="3"/>
  <line x1="233" y1="335" x2="233" y2="300" stroke="#596779" stroke-width="3"/>
  <text x="170" y="470" class="label">Merkur</text><text x="170" y="505" class="num">0,39 AU</text>

  <circle cx="351" cy="365" r="27" fill="#d9bd7b" stroke="#a98649" stroke-width="3"/>
  <line x1="351" y1="325" x2="351" y2="290" stroke="#596779" stroke-width="3"/>
  <text x="310" y="555" class="label">Venus</text><text x="310" y="590" class="num">0,72 AU</text>

  <circle cx="450" cy="365" r="31" fill="#4c92cf" stroke="#2b6fa5" stroke-width="3"/>
  <path d="M438 352 Q450 342 462 351 Q458 363 469 371 Q452 383 438 373 Z" fill="#5ca66b"/>
  <text x="415" y="470" class="label">Jorden</text><text x="415" y="505" class="num">1,00 AU</text>

  <circle cx="635" cy="365" r="25" fill="#c66b45" stroke="#95462c" stroke-width="3"/>
  <text x="595" y="555" class="label">Mars</text><text x="595" y="590" class="num">1,52 AU</text>
</g>

<!-- Outer planets -->
<rect x="45" y="630" width="810" height="355" rx="24" fill="#f5f1e9" stroke="#d2cdc3" stroke-width="3"/>
<text x="70" y="682" class="head">De ydre planeter</text>
<text x="70" y="716" class="sub">Ny skala: 0–31 AU. Afstandene vokser voldsomt.</text>
<line x1="95" y1="800" x2="805" y2="800" stroke="#25384d" stroke-width="5"/>
<g stroke="#8996a3" stroke-width="3"><line x1="95" y1="785" x2="95" y2="820"/><line x1="324" y1="785" x2="324" y2="820"/><line x1="553" y1="785" x2="553" y2="820"/><line x1="805" y1="785" x2="805" y2="820"/></g>
<text x="86" y="854" class="num">0</text><text x="296" y="854" class="num">10 AU</text><text x="525" y="854" class="num">20 AU</text><text x="762" y="854" class="num">31 AU</text>

<!-- outer markers on 0-31 AU scale -->
<g>
  <circle cx="214" cy="800" r="37" fill="#d9b98f" stroke="#a48159" stroke-width="3"/>
  <path d="M181 789 Q214 777 247 789 M180 805 Q214 794 248 805 M185 819 Q214 811 243 819" fill="none" stroke="#9b704f" stroke-width="5"/>
  <text x="145" y="925" class="label">Jupiter</text><text x="145" y="960" class="num">5,20 AU</text>

  <circle cx="314" cy="800" r="31" fill="#e0c58e" stroke="#aa8e5b" stroke-width="3"/>
  <ellipse cx="314" cy="800" rx="54" ry="14" fill="none" stroke="#a98a62" stroke-width="7" transform="rotate(-12 314 800)"/>
  <text x="280" y="735" class="label">Saturn</text><text x="280" y="768" class="num">9,58 AU</text>

  <circle cx="535" cy="800" r="30" fill="#7fc7d8" stroke="#4a9cb1" stroke-width="3"/>
  <text x="485" y="925" class="label">Uranus</text><text x="485" y="960" class="num">19,2 AU</text>

  <circle cx="785" cy="800" r="30" fill="#3e6fc6" stroke="#244c96" stroke-width="3"/>
  <text x="700" y="925" class="label">Neptun</text><text x="700" y="960" class="num">30,1 AU</text>
</g>

<text x="55" y="1035" class="note">De to paneler bruger forskellige skalaer. Planeternes størrelser er ikke målfast.</text>
</svg>