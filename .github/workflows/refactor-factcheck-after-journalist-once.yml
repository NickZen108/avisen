name: Move Fact checker after Journalist once

on:
  push:
    paths:
      - '.github/workflows/refactor-factcheck-after-journalist-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply refactor
        run: |
          python .github/scripts/refactor_factcheck_after_journalist.py
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/test_hybrid_runtime.py')
          s = p.read_text(encoding='utf-8')
          old = 'fact.decision = verified.length >= 1 ? "publish" : "hold"'
          new = 'fact.decision = verified.length >= 1 && unsupported.length === 0 ? "publish" : "hold"'
          if old not in s:
              raise SystemExit('hybrid test fact decision anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check cloudflare/newsdesk/src/editorial.js
          python scripts/test_hybrid_runtime.py
          git diff --check
      - name: Commit and clean up
        run: |
          git config user.name 'morgentidende-maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refactor-factcheck-after-journalist-once.yml .github/scripts/refactor_factcheck_after_journalist.py
          git add cloudflare/newsdesk/src/editorial.js scripts/test_hybrid_runtime.py
          git commit -m 'refactor: fact-check the finished article'
          git pull --rebase origin main
          git push origin main
