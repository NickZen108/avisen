name: Add Cloudflare AI status to control room

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_cloudflare_ai_status_control_room.py'
      - '.github/workflows/add-cloudflare-ai-status-control-room.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python scripts/add_cloudflare_ai_status_control_room.py
      - name: Syntax check app worker
        run: node --check cloudflare/app/src/index.js
      - name: Syntax check control room tabs
        run: node --check docs/kontrolrum/control-room-tabs.js
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'morgentidende-control-room'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/app/src/index.js docs/kontrolrum/control-room-tabs.js
          git commit -m 'feat: show Cloudflare AI quota status in control room'
          git push origin HEAD:main
