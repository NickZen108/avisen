# canonical one-shot migration; safe to re-run because patch script is idempotent
name: Apply location-aware hero policy
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_location_aware_hero.py'
      - '.github/workflows/apply-location-aware-hero.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Sync latest main
        run: git fetch origin main && git reset --hard origin/main
      - name: Apply location-aware Newsdesk source patch
        run: |
          python scripts/apply_location_aware_hero.py
          node --check cloudflare/newsdesk/src/editorial.js
          python scripts/refresh_pending_images.py --self-test
      - name: Commit canonical Newsdesk source
        id: commit
        run: |
          git config user.name "morgentidende-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/newsdesk/src/editorial.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "newsdesk: determine location before multilingual hero search"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy patched Newsdesk
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh workflow run cloudflare-newsdesk-deploy.yml --ref main
      - name: Rebuild public edition
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh workflow run build-publish.yml --ref main
