name: One-shot single editorial cycle
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-single-editorial-cycle.yml']
permissions: {contents: write}
concurrency:
  group: morgentidende-editorial-import
  cancel-in-progress: false
jobs:
  sync-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Sync latest main
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install image normalizer
        run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch scan and history
        run: |
          BASE='https://morgentidende-newsdesk.nicolaipetersen108.workers.dev'
          curl --fail --silent --show-error --max-time 30 "$BASE/candidates" -o /tmp/candidates.json
          curl --fail --silent --show-error --max-time 30 "$BASE/editorial/history" -o /tmp/editorial-history.json
      - name: Prefetch likely source pages
        run: |
          set +e
          python scripts/github_source_prefetch.py --scan /tmp/candidates.json --output /tmp/github-prefetch.json --limit 12
          python -m json.tool /tmp/github-prefetch.json >/dev/null 2>&1 || echo '{}' > /tmp/github-prefetch.json
          exit 0
      - name: Run exactly one editorial candidate
        env:
          EDITORIAL_RUN_TOKEN: ${{ secrets.EDITORIAL_RUN_TOKEN }}
        run: |
          set -euo pipefail
          BASE='https://morgentidende-newsdesk.nicolaipetersen108.workers.dev'
          OUT='/tmp/editorial.json'
          if [ -s /tmp/github-prefetch.json ]; then
            curl --fail --silent --show-error --max-time 240 -X POST \
              -H 'content-type: application/json' \
              -H "authorization: Bearer $EDITORIAL_RUN_TOKEN" \
              --data-binary @/tmp/github-prefetch.json \
              "$BASE/run-editorial" -o "$OUT"
          else
            curl --fail --silent --show-error --max-time 240 -X POST -H "authorization: Bearer $EDITORIAL_RUN_TOKEN" "$BASE/run-editorial" -o "$OUT"
          fi
          python -m json.tool "$OUT" >/dev/null
          jq '{status,stage,generated_at,slug,reason,runtime,handled_signal_keys}' "$OUT"
          python scripts/log_publication_attempt.py --input "$OUT"
          python scripts/sync_cloudflare_editorial.py --input "$OUT"
      - name: Canonical gates
        run: python scripts/quality_gate.py --prebuild && python scripts/pipeline_v2_gate.py && python scripts/source_independence_gate.py && python scripts/prepublish_surface_qa.py
      - name: Commit source-of-truth changes
        run: |
          set -euo pipefail
          git config user.name 'morgentidende-cloudflare-editorial'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles sources reports/editorial/approvals content/frontpage.json docs/img/auto reports/editorial/publication-attempts.jsonl 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m 'editorial: import single cycle result'; fi
          git pull --rebase origin main
          python scripts/build_control_room.py
          git add docs/kontrolrum 2>/dev/null || true
          if ! git diff --cached --quiet; then
            if git log -1 --pretty=%B | grep -Fq 'editorial: import single cycle result'; then git commit --amend --no-edit; else git commit -m 'control-room: refresh after single editorial cycle'; fi
          fi
          git push origin main
