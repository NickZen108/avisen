name: Udland 100 fair final Desk test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/udland-100-fair-final-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests feedparser python-dateutil numpy

      - name: Collect fresh RSS candidates
        env:
          RAW: /tmp/raw.json
        run: |
          python - <<'PY'
          import os,json,re,requests,feedparser
          from dateutil import parser as dp
          F=[
            ('Poland','RMF24','https://www.rmf24.pl/feed'),('Czechia','iDNES','https://servis.idnes.cz/rss.aspx?c=zpravodaj'),
            ('Slovakia','Aktuality','https://www.aktuality.sk/rss/'),('Croatia','Index','https://www.index.hr/rss/vijesti'),
            ('Estonia','ERR','https://news.err.ee/k/news/rss.xml'),('Lithuania','LRT','https://www.lrt.lt/?rss'),
            ('Romania','HotNews','https://hotnews.ro/feed'),('Hungary','Telex','https://telex.hu/rss'),
            ('Serbia','N1','https://n1info.rs/feed/'),('Latvia','LSM','https://www.lsm.lv/rss/'),
            ('Ukraine','UP','https://www.pravda.com.ua/rss/'),('Slovenia','RTV','https://www.rtvslo.si/feeds/00.xml'),
            ('France','France24','https://www.france24.com/en/rss'),('Italy','ANSA','https://www.ansa.it/sito/ansait_rss.xml'),
            ('Spain','ElPais','https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada'),('Ireland','RTE','https://www.rte.ie/feeds/rss/?index=/news/'),
            ('India','TheHindu','https://www.thehindu.com/news/international/feeder/default.rss'),('Nigeria','PremiumTimes','https://www.premiumtimesng.com/feed')]
          def clean(s): return re.sub(r'\s+',' ',re.sub('<[^>]+>',' ',s or '')).strip()
          def ts(e):
            try:return dp.parse(e.get('published') or e.get('updated') or '').timestamp()
            except:return 0
          A=[]; H={'User-Agent':'Morgentidende-Fair-Test/1.0'}
          for co,so,u in F:
            try:
              r=requests.get(u,headers=H,timeout=15); d=feedparser.parse(r.content)
            except: continue
            for e in d.entries[:24]:
              title=clean(e.get('title'))
              if title:A.append({'country':co,'source':so,'title':title,'summary':clean(e.get('summary') or e.get('description'))[:600],'published':clean(e.get('published') or e.get('updated')),'ts':ts(e)})
          A=sorted(A,key=lambda x:x['ts'],reverse=True)[:320]
          print('RAW',len(A)); json.dump(A,open(os.environ['RAW'],'w'),ensure_ascii=False)
          PY

      - name: Deploy temporary Workers AI endpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NAME="fairfinal-${GITHUB_RUN_ID}"; TOKEN="$(openssl rand -hex 20)"; echo "::add-mask::$TOKEN"; echo "NAME=$NAME" >>$GITHUB_ENV; echo "TOKEN=$TOKEN" >>$GITHUB_ENV
          cat >/tmp/w.js <<'JS'
          export default {async fetch(r,e){if(r.method==='GET')return Response.json({ok:true});if((r.headers.get('authorization')||'')!==`Bearer ${e.TOKEN}`)return new Response('no',{status:401});let b=await r.json();if(b.embed)return Response.json(await e.AI.run('@cf/baai/bge-m3',{text:b.text}));return Response.json(await e.AI.run(b.model,{messages:[{role:'system',content:b.system},{role:'user',content:b.user}],max_tokens:4000,temperature:0}));}}
          JS
          cat >/tmp/wrangler.jsonc <<EOF
          {"name":"$NAME","main":"/tmp/w.js","compatibility_date":"2026-09-01","ai":{"binding":"AI"},"vars":{"TOKEN":"$TOKEN"}}
          EOF
          npx --yes wrangler@4.127.1 deploy --config /tmp/wrangler.jsonc | tee /tmp/d.log
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/d.log | tail -1)"; echo "URL=$URL" >>$GITHUB_ENV
          for i in $(seq 1 20); do curl -fsS "$URL" >/dev/null && break; sleep 2; done

      - name: BGE-M3 cluster then identical 100-event Desk test
        env:
          RAW: /tmp/raw.json
        run: |
          python - <<'PY'
          import os,json,time,requests,numpy as np
          A=json.load(open(os.environ['RAW'])); U=os.environ['URL']; H={'Authorization':'Bearer '+os.environ['TOKEN'],'Content-Type':'application/json'}
          def post(j):
            last=None
            for _ in range(15):
              try:
                r=requests.post(U,headers=H,json=j,timeout=240); last=r
                if r.status_code==200:return r.json()
              except Exception: pass
              time.sleep(2)
            raise RuntimeError('endpoint failed '+(str(last.status_code)+' '+last.text[:500] if last else 'no response'))
          T=[(x['title']+' — '+x['summary'])[:1000] for x in A]; V=[]
          for i in range(0,len(T),25):V.extend(post({'embed':1,'text':T[i:i+25]}).get('data') or [])
          V=np.array(V,float); V/=np.linalg.norm(V,axis=1,keepdims=True)+1e-12
          C=[]; threshold=.76
          for i in range(len(A)):
            best=(-1,-1.0)
            for k,c in enumerate(C):
              s=float(V[i]@V[c[0]])
              if s>best[1]:best=(k,s)
            if best[0]>=0 and best[1]>=threshold:C[best[0]][1].append(i)
            else:C.append([i,[i]])
          E=[]
          for n,c in enumerate(C[:100],1):
            x=A[c[0]]; members=[A[j] for j in c[1]]
            E.append({'id':n,'country':x['country'],'source':x['source'],'title':x['title'],'summary':x['summary'],'cluster':len(members),'alts':[m['country']+' / '+m['source']+': '+m['title'] for m in members[1:4]]})
          print('DISTINCT_EVENTS',len(C),'USED',len(E),'MULTI_SOURCE_OR_VARIANT_CLUSTERS',sum(e['cluster']>1 for e in E),'THRESHOLD',threshold)
          assert len(E)==100
          payload='\n\n'.join(f"EVENT {e['id']} | {e['country']} | {e['source']} | cluster={e['cluster']}\nTitel: {e['title']}\nTeaser: {e['summary']}\nAlternative dækninger: {' ; '.join(e['alts'])}" for e in E)
          system='''Du er Desk Editor på Morgentidende, en dansk nationalkonservativ-liberal netavis. Du får PRÆCIS de samme 100 forskellige udenlandske nyhedsbegivenheder som to andre Desk-modeller. De er allerede semantisk deduplikeret med BGE-M3. Vælg de 3 FORSKELLIGE historier, du ville bestille artikler på NU til kategorien Udland. Prioritér: høj aktuel nyhedsværdi; betydning for Danmark/Europa; sikkerhed/forsvar/Rusland/migration/suverænitet/energi/økonomi/handel/regulering; borgerlig-liberal eller nationalkonservativ relevans; samt vigtige historier danske medier kan overse. Politisk profil må påvirke udvælgelse og journalistisk interesse, aldrig fakta. Undgå trivielt lokalt stof, service, sport og kultur. Hvis to events trods clustering ser ud til at være samme underliggende historie, må du kun vælge én af dem. Returnér KUN præcis tre linjer, ingen analyse før eller efter. Format: 1. EVENT <id> — <kort dansk rubrik> — <én konkret sætning om hvorfor>.'''
          models=[('LLAMA 8B','@cf/meta/llama-3.1-8b-instruct-fast'),('QWEN3 30B','@cf/qwen/qwen3-30b-a3b-fp8'),('GEMMA 4 26B','@cf/google/gemma-4-26b-a4b-it')]
          for name,m in models:
            o=post({'model':m,'system':system,'user':payload})
            text=o.get('response')
            if isinstance(text,dict): text=text.get('content') or text.get('text')
            if not text and o.get('choices'):
              msg=o['choices'][0].get('message',{}); text=msg.get('content') or msg.get('final') or msg.get('reasoning_content')
            if not text: text=o.get('result') if isinstance(o.get('result'),str) else None
            print('\n===== '+name+' =====')
            print(text if text else 'NO_TEXT_RETURNED\n'+json.dumps(o,ensure_ascii=False)[:12000])
          PY

      - name: Cleanup
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.127.1 delete --name "$NAME" --force || true
