name: One-shot Workers JSON parser fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-workers-json-parser-fix.yml']
permissions: {contents: write}
concurrency:
  group: morgentidende-main-writes
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Patch robust structured-response parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/newsdesk/src/editorial.js')
          s=p.read_text(encoding='utf-8')
          old='''function responseObject(raw) {\n  if (raw && typeof raw.response === "object" && raw.response !== null) return raw.response;\n  if (raw && typeof raw.response === "string") { try { return JSON.parse(raw.response); } catch (_) {} }\n  if (raw && Array.isArray(raw.choices)) {\n    const content = raw.choices[0]?.message?.content;\n    if (typeof content === "object" && content) return content;\n    if (typeof content === "string") { try { return JSON.parse(content); } catch (_) {} }\n  }\n  throw new Error("Workers AI returned no parseable structured response");\n}\n'''
          new='''function parseJsonText(value) {\n  const text = String(value || "").trim();\n  if (!text) return null;\n  try { return JSON.parse(text); } catch (_) {}\n  const unfenced = text.replace(/^```(?:json)?\\s*/i, "").replace(/\\s*```$/i, "").trim();\n  if (unfenced !== text) { try { return JSON.parse(unfenced); } catch (_) {} }\n  const starts = [];\n  for (let i = 0; i < text.length; i++) if (text[i] === "{" || text[i] === "[") starts.push(i);\n  for (const start of starts) {\n    const open = text[start], close = open === "{" ? "}" : "]";\n    let depth = 0, quoted = false, escaped = false;\n    for (let i = start; i < text.length; i++) {\n      const ch = text[i];\n      if (quoted) {\n        if (escaped) escaped = false;\n        else if (ch === "\\\\") escaped = true;\n        else if (ch === '"') quoted = false;\n        continue;\n      }\n      if (ch === '"') { quoted = true; continue; }\n      if (ch === open) depth += 1;\n      else if (ch === close) {\n        depth -= 1;\n        if (depth === 0) {\n          try { return JSON.parse(text.slice(start, i + 1)); } catch (_) { break; }\n        }\n      }\n    }\n  }\n  return null;\n}\nfunction responseObject(raw) {\n  if (raw && typeof raw.response === "object" && raw.response !== null) return raw.response;\n  if (raw && typeof raw.response === "string") { const parsed = parseJsonText(raw.response); if (parsed) return parsed; }\n  if (raw && Array.isArray(raw.choices)) {\n    const content = raw.choices[0]?.message?.content;\n    if (typeof content === "object" && content) return content;\n    if (typeof content === "string") { const parsed = parseJsonText(content); if (parsed) return parsed; }\n  }\n  throw new Error("Workers AI returned no parseable structured response");\n}\n'''
          if old not in s:
              raise SystemExit('responseObject target block not found')
          p.write_text(s.replace(old,new), encoding='utf-8')
          PY
          node --check cloudflare/newsdesk/src/editorial.js
      - name: Commit parser fix
        run: |
          git config user.name 'morgentidende-maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/newsdesk/src/editorial.js
          git commit -m 'fix: tolerate wrapped Workers AI JSON responses'
          git pull --rebase origin main
          git push origin main
