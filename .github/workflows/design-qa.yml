name: Design QA

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'docs/theme.css'
      - 'docs/theme.js'
      - 'docs/style.css'
      - 'docs/morgentidende-ui.css'
      - 'docs/account-ui.css'
      - 'docs/signup.css'
      - 'scripts/design_enhancements.py'
      - 'scripts/reader_experience.py'
      - 'scripts/live_surface_qa.py'
      - '.github/workflows/design-qa.yml'
  pull_request:
    paths:
      - 'templates/**'
      - 'docs/theme.css'
      - 'docs/theme.js'
      - 'docs/style.css'
      - 'docs/morgentidende-ui.css'
      - 'docs/account-ui.css'
      - 'docs/signup.css'
      - 'scripts/design_enhancements.py'
      - 'scripts/reader_experience.py'
      - 'scripts/live_surface_qa.py'
      - '.github/workflows/design-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shared design surface QA
        run: python scripts/live_surface_qa.py --base-url https://morgentidende.nicolaipetersen108.workers.dev/ --recent-hours 24 --report reports/qa/live-surface-latest.md
      - name: Upload design QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-qa-${{ github.run_id }}
          path: reports/qa/live-surface-latest.md
          if-no-files-found: warn
          retention-days: 14
