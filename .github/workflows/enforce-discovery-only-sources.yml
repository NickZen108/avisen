name: Enforce discovery-only sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enforce-discovery-only-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --ff-only origin main
      - name: Apply source policy
        run: python scripts/enforce_discovery_policy.py
      - name: Validate policy
        run: |
          node --check cloudflare/newsdesk/src/editorial.js
          grep -q 'Discovery-only source crossed the Journalist boundary' cloudflare/newsdesk/src/editorial.js
          grep -q 'const evidenceUsable = usable.filter(isEvidenceSource)' cloudflare/newsdesk/src/editorial.js
      - name: Commit source hardening
        run: |
          set -euo pipefail
          git config user.name 'morgentidende-source-policy'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/newsdesk/src/editorial.js
          git commit -m 'policy: make discovery blogs impossible as sources'
          git pull --rebase origin main
          git push origin main
