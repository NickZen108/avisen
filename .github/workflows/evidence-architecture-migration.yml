name: Evidence architecture migration
# trigger: structured provenance metadata
on:
  push:
    branches: [main]
    paths: ['.github/workflows/evidence-architecture-migration.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: morgentidende-main-writes
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Sync latest main
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply structured provenance
        run: python scripts/apply_structured_provenance.py
      - name: Validate architecture
        run: |
          node --check cloudflare/newsdesk/src/editorial.js
          python scripts/evidence_policy_selftest.py
          python scripts/test_hybrid_runtime.py
          python scripts/quality_gate.py --prebuild
          python scripts/source_independence_gate.py
          python scripts/pipeline_v2_gate.py
          git diff --check
      - name: Commit and push with race retry
        run: |
          set -euo pipefail
          git config user.name 'morgentidende-evidence-migration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/newsdesk/src/editorial.js scripts/evidence_policy.py scripts/evidence_policy_selftest.py
          git commit -m 'refactor: add structured source provenance'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
