name: Dispatch burst 3 now
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dispatch-burst-3-now.yml']
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch 3-cycle burst
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run burst-3-once.yml -R NickZen108/avisen --ref main -f cycles=3
