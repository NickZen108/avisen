name: Release scheduled articles

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morgentidende-main-writes
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release due scheduled articles
        run: python scripts/release_scheduled.py
      - name: Validate canonical state
        run: python scripts/quality_gate.py --prebuild
      - name: Commit released canonical articles
        run: |
          git config user.name "morgentidende-scheduler"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles
          if git diff --cached --quiet; then
            echo "Ingen planlagte artikler klar"
          else
            git commit -m "schedule: release due articles"
            git push
          fi
