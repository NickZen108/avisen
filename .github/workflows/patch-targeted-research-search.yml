name: Apply targeted Research web search patch

on:
  push:
    paths:
      - '.github/workflows/patch-targeted-research-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_targeted_research_search.py
      - name: Validate runtime
        run: |
          node --check cloudflare/newsdesk/src/editorial.js
          git diff --check
      - name: Commit and clean up
        run: |
          git config user.name 'morgentidende-maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-targeted-research-search.yml scripts/patch_targeted_research_search.py
          git add cloudflare/newsdesk/src/editorial.js
          git commit -m 'research: add independent targeted web search'
          git pull --rebase origin main
          git push origin main
