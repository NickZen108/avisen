name: Fix Scandinavian language leakage once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-scandinavian-language-leak-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Strengthen existing Danish language instructions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/newsdesk/src/editorial.js')
          s=p.read_text(encoding='utf-8')
          old='Skriv præcist, levende og idiomatisk dansk; oversæt norsk/svensk/engelsk fuldt, bortset fra egennavne og officielle produktnavne.'
          new='Skriv præcist, levende og idiomatisk dansk; oversæt norsk/svensk/engelsk fuldt, bortset fra egennavne og officielle navne. Oversæt også almindelige jobtitler og faste vendinger. Norske former som styreleder, nestleder, går av, gått av, etter, nei, overtar, ledervervet, kaptein, vanskelig og sjokk- må aldrig stå som dansk; brug naturlige danske ord og bøjninger.'
          assert old in s
          s=s.replace(old,new,1)
          old2='(language) tydeligt fremmedsprogligt læk, brudt dansk eller uklar formulering som faktisk kræver reparation;'
          new2='(language) tydeligt fremmedsprogligt læk, brudt dansk eller uklar formulering som faktisk kræver reparation. Fang især norsk/svensk læk i ellers dansk tekst, fx styreleder, nestleder, går av, gått av, etter, nei, overtar, ledervervet, kaptein, vanskelig og sjokk-;'
          assert old2 in s
          s=s.replace(old2,new2,1)
          old3='Ændr ikke fakta, attribution, vinkel eller betydning. Ret kun de konkrete sprogproblemer fra Slutredaktøren.`'
          new3='Ændr ikke fakta, attribution, vinkel eller betydning. Ret kun de konkrete sprogproblemer fra Slutredaktøren. Fjern alle norske/svenske almindelige ord og bøjninger; egennavne og officielle navne bevares.`'
          assert old3 in s
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check cloudflare/newsdesk/src/editorial.js
          python scripts/test_hybrid_runtime.py
      - name: Commit runtime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/newsdesk/src/editorial.js
          git commit -m 'fix: catch Scandinavian language leakage' || exit 0
          git push origin main
