name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prebuild gates
        run: python scripts/quality_gate.py --prebuild
      - name: Deterministic build
        run: python scripts/build_all.py
      - name: Postbuild gates
        run: python scripts/quality_gate.py
      - name: Show generated drift
        run: git diff --check
