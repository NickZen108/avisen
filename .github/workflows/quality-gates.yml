name: Quality gates
on:
  pull_request:
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: read}
concurrency: {group: 'quality-${{ github.event.pull_request.number || github.sha }}', cancel-in-progress: true}
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Script syntax
        run: python -m compileall -q scripts && bash -n scripts/scan-feeds.sh
      - name: Normalize prematurely-ready articles
        run: python scripts/release_ready.py --normalize-only
      - name: Prebuild gates
        run: python scripts/quality_gate.py --prebuild && python scripts/pipeline_v2_gate.py && python scripts/readability_gate.py && python scripts/prepublish_surface_qa.py
      - name: Deterministic build
        run: python scripts/build_all_v2.py
      - name: Postbuild gates
        run: python scripts/quality_gate.py && python scripts/pipeline_v2_gate.py && python scripts/readability_gate.py && python scripts/prepublish_surface_qa.py
      - name: Show generated drift
        run: git diff --check
