name: Quality gates
on:
  pull_request:
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: read}
concurrency: {group: 'quality-${{ github.event.pull_request.number || github.sha }}', cancel-in-progress: true}
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Script syntax
        run: python -m compileall -q scripts && bash -n scripts/scan-feeds.sh && node --check cloudflare/app/src/index.js && node --check cloudflare/site-worker.js && node --check cloudflare/newsdesk/src/index.js && node --check cloudflare/newsdesk/src/editorial.js && node --check docs/kontrolrum/control-room-tabs.js
      - name: Secret leak gate
        run: python scripts/secret_scan.py
      - name: Hybrid and workflow regression tests
        run: |
          python scripts/test_hybrid_runtime.py
          python scripts/reapprove_media_change.py --self-test
          python scripts/editorial_sync_contract_test.py
          python scripts/claim_passage_contract_test.py
          python scripts/evidence_policy_selftest.py
          python scripts/release_ready.py --self-test
          python scripts/lead_followup.py --self-test
          node scripts/test_structured_json.mjs
      - name: Normalize prematurely-ready articles
        run: python scripts/release_ready.py --normalize-only
      - name: Prebuild gates
        run: python scripts/quality_gate.py --prebuild && python scripts/pipeline_v2_gate.py && python scripts/source_independence_gate.py && python scripts/readability_gate.py && python scripts/prepublish_surface_qa.py
      - name: Deterministic build
        run: python scripts/build_all_v2.py && python scripts/build_short_videos.py && python scripts/design_enhancements.py && python scripts/reader_experience.py && python scripts/article_history.py && python scripts/editorial_analytics.py && python scripts/production_readiness.py && python scripts/queue_recovery.py && python scripts/build_control_room.py && python scripts/apply_control_room_extras.py && python scripts/seo_surface_fix.py
      - name: Postbuild gates
        run: python scripts/quality_gate.py && python scripts/pipeline_v2_gate.py && python scripts/source_independence_gate.py && python scripts/readability_gate.py && python scripts/prepublish_surface_qa.py && python scripts/golden_path_gate.py && python scripts/production_readiness.py
      - name: Show generated drift
        run: git diff --check
