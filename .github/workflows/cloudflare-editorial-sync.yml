name: Cloudflare editorial sync

# manual-three-cycle-trigger: 2026-09-02T09:28+02:00 json-repair

# Pushes to this workflow run a fresh live editorial cycle through the hardened source boundary.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_cloudflare_editorial.py'
      - '.github/workflows/cloudflare-editorial-sync.yml'
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Maximum distinct editorial candidates to process'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: morgentidende-editorial-import
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image normalizer
        run: python -m pip install --disable-pip-version-check pillow
      - name: Self-test cheap hybrid helpers
        run: |
          python scripts/editorial_dispatch_gate.py --self-test
          python scripts/github_source_prefetch.py --self-test
      - name: Fetch scan and editorial history for cheap dispatch
        run: |
          set +e
          BASE='https://morgentidende-newsdesk.nicolaipetersen108.workers.dev'
          curl --fail --silent --show-error --max-time 30 "$BASE/candidates" -o /tmp/candidates.json
          curl --fail --silent --show-error --max-time 30 "$BASE/editorial/history" -o /tmp/editorial-history.json
          exit 0
      - name: Decide how many AI editorial cycles are actually needed
        id: dispatch
        env:
          INPUT_CYCLES: ${{ github.event.inputs.cycles }}
        run: |
          MAX="${INPUT_CYCLES:-1}"
          case "$MAX" in 1|2|3) ;; *) MAX=1 ;; esac
          python scripts/editorial_dispatch_gate.py \
            --scan /tmp/candidates.json \
            --history /tmp/editorial-history.json \
            --max-cycles "$MAX" \
            --github-output "$GITHUB_OUTPUT"
      - name: Skip unnecessary Workers AI calls
        if: ${{ steps.dispatch.outputs.cycles == '0' }}
        run: echo "Ingen friske ubehandlede kandidater; GitHub dispatch-gate sparer denne AI-runde."
      - name: Prefetch likely source pages on GitHub
        if: ${{ steps.dispatch.outputs.cycles != '0' }}
        run: |
          set +e
          python scripts/github_source_prefetch.py --scan /tmp/candidates.json --output /tmp/github-prefetch.json --limit 12
          if ! python -m json.tool /tmp/github-prefetch.json >/dev/null 2>&1; then
            echo '{}' > /tmp/github-prefetch.json
          fi
          exit 0
      - name: Run and import distinct editorial candidates
        if: ${{ steps.dispatch.outputs.cycles != '0' }}
        env:
          INPUT_CYCLES: ${{ steps.dispatch.outputs.cycles }}
          EDITORIAL_RUN_TOKEN: ${{ secrets.EDITORIAL_RUN_TOKEN }}
        run: |
          set -euo pipefail
          BASE='https://morgentidende-newsdesk.nicolaipetersen108.workers.dev'
          MAX="${INPUT_CYCLES:-1}"
          case "$MAX" in 1|2|3) ;; *) MAX=1 ;; esac
          for i in $(seq 1 "$MAX"); do
            OUT="/tmp/editorial-$i.json"
            if [ -s /tmp/github-prefetch.json ]; then
              curl --fail --silent --show-error --max-time 240 -X POST \
                -H 'content-type: application/json' \
                -H "authorization: Bearer $EDITORIAL_RUN_TOKEN" \
                --data-binary @/tmp/github-prefetch.json \
                "$BASE/run-editorial" -o "$OUT"
            else
              curl --fail --silent --show-error --max-time 240 -X POST -H "authorization: Bearer $EDITORIAL_RUN_TOKEN" "$BASE/run-editorial" -o "$OUT"
            fi
            python -m json.tool "$OUT" >/dev/null
            jq '{status,stage,generated_at,slug,reason,runtime,handled_signal_keys}' "$OUT"
            python scripts/log_publication_attempt.py --input "$OUT"
            python scripts/sync_cloudflare_editorial.py --input "$OUT"
            HANDLED=$(jq '(.handled_signal_keys // []) | length' "$OUT")
            STATUS=$(jq -r '.status // "hold"' "$OUT")
            STAGE=$(jq -r '.stage // ""' "$OUT")
            if [ "$STATUS" = 'approved' ]; then
              echo 'Godkendt artikel fundet; stopper denne kvartér-runde efter første publicerbare artikel.'
              break
            fi
            if [ "$STAGE" = 'runtime-error' ]; then
              if [ "$i" -lt "$MAX" ]; then
                echo 'Transient Workers AI/runtime-fejl; prøver næste cycle i samme runde.'
                continue
              fi
              echo 'Runtime-fejl på sidste tilladte cycle i denne runde.'
              break
            fi
            if [ "$HANDLED" -eq 0 ] && [ "$STATUS" != 'approved' ]; then
              echo 'Ingen yderligere distinkt kandidat i denne runde'
              break
            fi
          done
      - name: Enforce article-production write boundary
        run: |
          set -euo pipefail
          if ! git diff --quiet -- templates docs/theme.css docs/theme.js docs/style.css; then
            echo 'ARTICLE WRITE BOUNDARY FAIL: editorial production changed protected template/CSS/theme files' >&2
            git diff -- templates docs/theme.css docs/theme.js docs/style.css >&2
            exit 1
          fi
      - name: Canonical gates before commit
        run: python scripts/quality_gate.py --prebuild && python scripts/pipeline_v2_gate.py && python scripts/prepublish_surface_qa.py
      - name: Commit source-of-truth editorial changes
        run: |
          set -euo pipefail
          git config user.name 'morgentidende-cloudflare-editorial'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Commit only source-of-truth data before rebasing. Generated Control Room
          # HTML is deliberately excluded here to avoid rebase conflicts with other
          # workflows that rebuild the same file.
          git add content/articles sources reports/editorial/approvals content/frontpage.json docs/img/auto reports/editorial/publication-attempts.jsonl 2>/dev/null || true

          if git diff --cached --quiet; then
            echo 'Ingen nye redaktionelle source-of-truth ændringer at committe'
          else
            git commit -m 'editorial: import cycle results'
          fi

          # Discard only unstaged/generated workspace drift. Source-of-truth changes
          # are already committed above, so this makes rebase deterministic.
          git reset --hard HEAD

          # Rebase the compact source-of-truth commit first. If main moved because
          # another workflow rebuilt generated pages, those generated files are not
          # part of our commit and therefore cannot conflict here.
          git pull --rebase origin main

      - name: Rebuild Control Room after rebase
        run: |
          set -euo pipefail
          python scripts/build_control_room.py
          git add docs/kontrolrum 2>/dev/null || true

          if ! git diff --cached --quiet; then
            if git log -1 --pretty=%B | grep -Fq 'editorial: import cycle results'; then
              git commit --amend --no-edit
            else
              git commit -m 'control-room: refresh after editorial sync'
            fi
          fi

      - name: Push editorial sync atomically
        run: |
          set -euo pipefail
          # A second lightweight fetch protects against a tiny race between the rebase
          # and push. Retry once by rebasing source truth, rebuilding generated UI, and
          # pushing again.
          if git push origin main; then
            exit 0
          fi

          echo 'Main flyttede sig mellem rebase og push; prøver én sikker retry.'
          git pull --rebase origin main
          python scripts/build_control_room.py
          git add docs/kontrolrum 2>/dev/null || true
          if ! git diff --cached --quiet; then
            if git log -1 --pretty=%B | grep -Eq 'editorial: import cycle results|control-room: refresh after editorial sync'; then
              git commit --amend --no-edit
            else
              git commit -m 'control-room: refresh after editorial sync'
            fi
          fi
          git push origin main
