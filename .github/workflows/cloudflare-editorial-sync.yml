name: Cloudflare editorial sync

on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Maximum distinct editorial candidates to process'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: morgentidende-editorial-import
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image normalizer
        run: python -m pip install --disable-pip-version-check pillow
      - name: Run and import distinct editorial candidates
        env:
          INPUT_CYCLES: ${{ github.event.inputs.cycles }}
        run: |
          set -euo pipefail
          BASE='https://morgentidende-newsdesk.nicolaipetersen108.workers.dev'
          MAX='${INPUT_CYCLES:-3}'
          case "$MAX" in 1|2|3) ;; *) MAX=3 ;; esac
          for i in $(seq 1 "$MAX"); do
            OUT="/tmp/editorial-$i.json"
            curl --fail --silent --show-error --max-time 240 -X POST "$BASE/run-editorial" -o "$OUT"
            python -m json.tool "$OUT" >/dev/null
            jq '{status,stage,generated_at,slug,reason,runtime,handled_signal_keys}' "$OUT"
            python scripts/log_publication_attempt.py --input "$OUT"
            python scripts/sync_cloudflare_editorial.py --input "$OUT"
            HANDLED=$(jq '(.handled_signal_keys // []) | length' "$OUT")
            STATUS=$(jq -r '.status // "hold"' "$OUT")
            STAGE=$(jq -r '.stage // ""' "$OUT")
            if [ "$STAGE" = 'runtime-error' ] || { [ "$HANDLED" -eq 0 ] && [ "$STATUS" != 'approved' ]; }; then
              echo 'Ingen yderligere distinkt kandidat i denne runde'
              break
            fi
          done
      - name: Canonical gates before commit
        run: python scripts/quality_gate.py --prebuild && python scripts/pipeline_v2_gate.py && python scripts/prepublish_surface_qa.py
      - name: Refresh control room report
        run: python scripts/build_control_room.py
      - name: Commit imported packages and attempt log
        run: |
          set -euo pipefail
          git config user.name 'morgentidende-cloudflare-editorial'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles sources reports/editorial/approvals content/frontpage.json docs/img/auto reports/editorial/publication-attempts.jsonl docs/kontrolrum 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Ingen ny godkendt artikel eller rapport at importere'
          else
            git commit -m 'editorial: import cycle results'
            git pull --rebase origin main
            git push origin main
          fi
