name: Make language repair conditional once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/conditional-language-repair-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/maintenance_make_language_conditional_once.py
      - name: Validate runtime syntax
        run: |
          node --check cloudflare/newsdesk/src/editorial.js
          git diff --check
      - name: Remove one-shot files
        run: rm scripts/maintenance_make_language_conditional_once.py .github/workflows/conditional-language-repair-once.yml
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: make language repair conditional and cheaper'
          git pull --rebase origin main
          git push origin main
