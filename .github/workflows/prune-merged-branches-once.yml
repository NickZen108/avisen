name: Prune merged branches once
on:
  push:
    paths:
      - .github/workflows/prune-merged-branches-once.yml
jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete fully merged remote branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(
            git branch -r --merged origin/main \
              | sed 's#^[ *]*origin/##' \
              | grep -v '^HEAD ->' \
              | grep -v '^main$' \
              | sort -u
          )
          echo "Merged branches eligible for deletion: ${#branches[@]}"
          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            git push origin --delete "$branch"
          done
      - name: Self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/prune-merged-branches-once.yml
          git add -A
          git commit -m 'cleanup: remove one-shot branch pruner'
          git push origin HEAD:main
