name: Udland 100 Desk model test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/udland-100-desk-model-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests feedparser python-dateutil

      - name: Scan 100 fresh Udland candidates from foreign RSS/Atom feeds
        env:
          OUT: /tmp/udland100.json
        run: |
          python - <<'PY'
          import json, re, os, time
          import requests, feedparser
          from dateutil import parser as dtparser
          from datetime import datetime, timezone

          feeds = [
            ('Poland','RMF24',['https://www.rmf24.pl/feed']),
            ('Czechia','iDNES',['https://servis.idnes.cz/rss.aspx?c=zpravodaj']),
            ('Slovakia','Aktuality',['https://www.aktuality.sk/rss/']),
            ('Croatia','Index.hr',['https://www.index.hr/rss/vijesti']),
            ('Estonia','ERR',['https://news.err.ee/k/news/rss.xml','https://www.err.ee/rss']),
            ('Lithuania','LRT',['https://www.lrt.lt/?rss']),
            ('Romania','HotNews',['https://hotnews.ro/feed','https://rss.hotnews.ro']),
            ('Hungary','Telex',['https://telex.hu/rss','https://telex.hu/rss/all']),
            ('Serbia','N1 Serbia',['https://n1info.rs/feed/']),
            ('Latvia','LSM',['https://www.lsm.lv/rss/','https://eng.lsm.lv/rss/']),
            ('Ukraine','Ukrainska Pravda',['https://www.pravda.com.ua/rss/']),
            ('Slovenia','RTV Slovenija',['https://www.rtvslo.si/feeds/00.xml']),
            ('Bulgaria','Novinite',['https://www.novinite.com/services/news_rss.php']),
            ('United Kingdom','BBC World',['https://feeds.bbci.co.uk/news/world/rss.xml']),
            ('Germany','DW',['https://rss.dw.com/rdf/rss-en-world']),
            ('France','France 24',['https://www.france24.com/en/rss']),
            ('Italy','ANSA',['https://www.ansa.it/sito/ansait_rss.xml']),
            ('Spain','El Pais',['https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada']),
            ('Ireland','RTE',['https://www.rte.ie/feeds/rss/?index=/news/']),
            ('United States','NPR World',['https://feeds.npr.org/1004/rss.xml']),
            ('Canada','CBC World',['https://www.cbc.ca/cmlink/rss-world']),
            ('Australia','ABC News',['https://www.abc.net.au/news/feed/51120/rss.xml']),
            ('New Zealand','RNZ',['https://www.rnz.co.nz/rss/world.xml']),
            ('Japan','NHK World',['https://www3.nhk.or.jp/rss/news/cat0.xml']),
            ('India','The Hindu',['https://www.thehindu.com/news/international/feeder/default.rss']),
            ('Singapore','CNA',['https://www.channelnewsasia.com/api/v1/rss-outbound-feed?_format=xml']),
            ('South Korea','Korea Herald',['https://www.koreaherald.com/rss']),
            ('Israel','Times of Israel',['https://www.timesofisrael.com/feed/']),
            ('Turkey','Daily Sabah',['https://www.dailysabah.com/rss']),
            ('South Africa','News24',['https://feeds.news24.com/articles/news24/TopStories/rss']),
            ('Nigeria','Premium Times',['https://www.premiumtimesng.com/feed']),
            ('Kenya','Nation',['https://nation.africa/kenya/rss']),
            ('Brazil','Agencia Brasil',['https://agenciabrasil.ebc.com.br/rss/ultimasnoticias/feed.xml']),
            ('Argentina','Buenos Aires Herald',['https://buenosairesherald.com/feed']),
            ('Mexico','Mexico News Daily',['https://mexiconewsdaily.com/feed/']),
          ]

          def clean(s):
            s = re.sub('<[^>]+>', ' ', s or '')
            s = re.sub(r'\s+', ' ', s).strip()
            return s

          def ts(entry):
            raw = entry.get('published') or entry.get('updated') or ''
            try:
              return dtparser.parse(raw).timestamp()
            except Exception:
              return 0

          headers={'User-Agent':'Mozilla/5.0 Morgentidende-Scan-Test/1.0'}
          all_items=[]
          working=[]
          for country,source,urls in feeds:
            doc=None; used=None
            for url in urls:
              try:
                r=requests.get(url,headers=headers,timeout=12)
                if r.status_code != 200: continue
                d=feedparser.parse(r.content)
                if d.entries:
                  doc=d; used=url; break
              except Exception:
                continue
            if not doc: continue
            working.append((country,source,used,len(doc.entries)))
            for e in doc.entries[:12]:
              title=clean(e.get('title',''))
              if not title: continue
              summary=clean(e.get('summary','') or e.get('description',''))[:900]
              all_items.append({
                'country':country,'source':source,'feed':used,'title':title,'summary':summary,
                'published':clean(e.get('published','') or e.get('updated','')),
                'link':e.get('link',''),'ts':ts(e)
              })

          # Deduplicate exact/near-exact titles, then take globally freshest 100.
          seen=set(); unique=[]
          for x in sorted(all_items,key=lambda z:z['ts'],reverse=True):
            key=re.sub(r'\W+','',x['title'].lower())[:220]
            if not key or key in seen: continue
            seen.add(key); unique.append(x)
          picked=unique[:100]
          if len(picked)<100:
            raise SystemExit(f'Only collected {len(picked)} unique fresh items from {len(working)} working feeds')
          for i,x in enumerate(picked,1): x['id']=i
          json.dump(picked,open(os.environ['OUT'],'w'),ensure_ascii=False,indent=2)
          print(f'WORKING_FEEDS={len(working)} TOTAL_ITEMS={len(all_items)} UNIQUE={len(unique)} PICKED={len(picked)}')
          print('SOURCE_COUNTS:')
          from collections import Counter
          for (country,source),n in Counter((x['country'],x['source']) for x in picked).most_common():
            print(f'  {country} | {source}: {n}')
          print('\n=== 100 SCAN CANDIDATES ===')
          for x in picked:
            print(f"{x['id']:03d}. {x['country']} | {x['source']} | {x['title']} | {x['published']}")
          PY

      - name: Prepare temporary ranking Worker
        run: |
          set -euo pipefail
          WORKER_NAME="morgentidende-udland100-${GITHUB_RUN_ID}"
          RUN_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$RUN_TOKEN"
          echo "WORKER_NAME=$WORKER_NAME" >> "$GITHUB_ENV"
          echo "RUN_TOKEN=$RUN_TOKEN" >> "$GITHUB_ENV"
          cat >/tmp/rank-worker.js <<'JS'
          export default {
            async fetch(request, env) {
              if (request.method === 'GET') return Response.json({ok:true});
              if ((request.headers.get('authorization')||'') !== `Bearer ${env.RUN_TOKEN}`) return new Response('unauthorized',{status:401});
              const b=await request.json();
              const allowed=new Set(['@cf/meta/llama-3.1-8b-instruct-fast','@cf/qwen/qwen3-30b-a3b-fp8','@cf/google/gemma-4-26b-a4b-it']);
              if(!allowed.has(b.model)) return new Response('bad model',{status:400});
              const result=await env.AI.run(b.model,{messages:[{role:'system',content:b.system},{role:'user',content:b.user}],max_tokens:2400,temperature:0.1});
              return Response.json(result);
            }
          }
          JS
          cat >/tmp/wrangler.jsonc <<EOF
          {"name":"$WORKER_NAME","main":"/tmp/rank-worker.js","compatibility_date":"2026-09-01","ai":{"binding":"AI"},"vars":{"RUN_TOKEN":"$RUN_TOKEN"}}
          EOF

      - name: Deploy temporary Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 deploy --config /tmp/wrangler.jsonc | tee /tmp/deploy.log
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/deploy.log | tail -1 || true)"
          if [ -z "$URL" ]; then URL="https://${WORKER_NAME}.nicolaipetersen108.workers.dev"; fi
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"
          for i in $(seq 1 12); do curl --fail --silent --max-time 10 "$URL" >/dev/null && exit 0; sleep 3; done
          exit 1

      - name: Each Desk model picks 3 articles for Morgentidende Udland
        env:
          CANDIDATES: /tmp/udland100.json
        run: |
          python - <<'PY'
          import json, os, requests
          c=json.load(open(os.environ['CANDIDATES']))
          system='''Du er Desk Editor på Morgentidende, en dansk nationalkonservativ-liberal netavis. Du får præcis 100 helt friske udenlandske nyhedskandidater fra RSS/Atom-feeds hos udenlandske medier. Vælg de 3 historier, som du ville bestille artikler på NU til kategorien Udland. Vægt: stor og aktuel nyhedsværdi; direkte eller indirekte betydning for Danmark og Europa; sikkerhed, forsvar, Rusland, migration, suverænitet, energi, økonomi, handel og regulering; historier med borgerlig/liberal eller nationalkonservativ relevans; og stærke historier som danske medier kan have overset. Den politiske profil må påvirke interesse og vinkel, men aldrig fakta. Undgå trivielle lokale ulykker, servicejournalistik og kulturstof, medmindre der er ekstraordinær international relevans. Du må kun vælge blandt kandidatnumrene. Returnér præcis 3 valg i prioriteret rækkefølge. For hvert valg: kandidatnummer, land, kort dansk rubrik, hvorfor historien er vigtig for Morgentidende, og hvilken journalistisk vinkel du ville bestille. Svar kompakt og konkret.'''
          payload='\n\n'.join(f"KANDIDAT {x['id']} | {x['country']} | {x['source']}\nTitel: {x['title']}\nTeaser: {x['summary']}\nTid: {x['published']}" for x in c)
          models=[('LLAMA 3.1 8B FAST','@cf/meta/llama-3.1-8b-instruct-fast'),('QWEN3 30B','@cf/qwen/qwen3-30b-a3b-fp8'),('GEMMA 4 26B','@cf/google/gemma-4-26b-a4b-it')]
          H={'Authorization':f"Bearer {os.environ['RUN_TOKEN']}",'Content-Type':'application/json'}
          for name,model in models:
            r=requests.post(os.environ['WORKER_URL'],headers=H,json={'model':model,'system':system,'user':payload},timeout=240)
            print('\n\n############################'); print('MODEL:',name,'HTTP',r.status_code); print('############################')
            r.raise_for_status(); o=r.json(); text=o.get('response')
            if not text and o.get('choices'):
              msg=o['choices'][0].get('message',{}); text=msg.get('content') or msg.get('reasoning_content') or ''
            if not text: text=json.dumps(o,ensure_ascii=False)
            print(text)
          PY

      - name: Cleanup Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.127.1 delete --name "$WORKER_NAME" --force || true
