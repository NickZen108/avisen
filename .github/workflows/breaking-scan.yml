name: Breaking scan

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/newsroom-run"

permissions:
  contents: write

concurrency:
  group: morgentidende-main-writes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync Cloudflare Newsdesk runtime
        env:
          EDITORIAL_RUN_TOKEN: ${{ secrets.EDITORIAL_RUN_TOKEN }}
        run: |
          set +e
          python scripts/sync_cloudflare_scan.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Cloudflare Newsdesk synced"
          elif [ "$rc" -eq 3 ]; then
            echo "Cloudflare Newsdesk auth failed or required secret is unavailable; refusing unauthenticated fallback." >&2
            exit 1
          else
            echo "Cloudflare Newsdesk unavailable; using temporary GitHub fallback"
            bash scripts/scan-feeds.sh
          fi
      - name: Commit scan state
        run: |
          git config user.name "morgentidende-scan"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan/latest.md queue/candidates.json
          if git diff --cached --quiet; then
            echo "Ingen ændring"
          else
            git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
