name: Breaking scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/newsroom-run"

permissions:
  contents: write

concurrency:
  group: morgentidende-main-writes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Translate current lead into follow-up search needs
        run: |
          python scripts/lead_followup.py --sync
          python scripts/followup_plan.py
          cat reports/editorial/followup-plan.json
      - name: Refresh candidate queue
        run: |
          if python scripts/sync_cloudflare_scan.py; then
            echo "Cloudflare Newsdesk synced"
          else
            echo "Cloudflare Newsdesk unavailable; using GitHub feed fallback"
            bash scripts/scan-feeds.sh
            python scripts/newsroom_queue.py
          fi
      - name: Commit scan state
        run: |
          git config user.name "morgentidende-scan"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan/latest.md queue/candidates.json reports/editorial/lead-followup.json reports/editorial/followup-plan.json
          if git diff --cached --quiet; then
            echo "Ingen ændring"
          else
            git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
