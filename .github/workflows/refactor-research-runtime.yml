name: Refactor Research runtime

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refactor_research_runtime.py'
      - '.github/workflows/refactor-research-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --ff-only origin main
      - name: Apply Research refactor
        run: python scripts/refactor_research_runtime.py
      - name: Validate runtime
        run: |
          node --check cloudflare/newsdesk/src/editorial.js
          grep -q 'researchSchema, 850' cloudflare/newsdesk/src/editorial.js
          grep -q 'excerpt: item.excerpt.slice(0, 5000)' cloudflare/newsdesk/src/editorial.js
          grep -q 'assignment.weight !== "A"' cloudflare/newsdesk/src/editorial.js
          grep -q 'if (unique.length >= 5) break' cloudflare/newsdesk/src/editorial.js
      - name: Commit runtime refactor
        run: |
          set -euo pipefail
          git config user.name 'morgentidende-research-refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/newsdesk/src/editorial.js
          git commit -m 'refactor: cheaper more permissive Research runtime'
          git pull --rebase origin main
          git push origin main
