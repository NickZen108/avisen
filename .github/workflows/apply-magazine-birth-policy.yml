name: Apply magazine birth policy

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_magazine_birth_policy.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magazine-birth-policy
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git fetch origin main && git reset --hard origin/main
      - name: Patch canonical Newsdesk source
        run: |
          python scripts/apply_magazine_birth_policy.py
          node --check cloudflare/newsdesk/src/editorial.js
      - name: Commit canonical source change
        run: |
          if git diff --quiet -- cloudflare/newsdesk/src/editorial.js; then
            echo 'Already applied.'
            exit 0
          fi
          git config user.name 'morgentidende-publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/newsdesk/src/editorial.js
          git commit -m 'newsdesk: make magazine destination part of article birth'
          git push origin main
