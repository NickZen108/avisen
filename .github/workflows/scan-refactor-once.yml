name: Scan refactor once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scan-refactor-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morgentidende-main-writes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix one-shot patch helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/_apply_scan_refactor_once.py')
          s=p.read_text(encoding='utf-8')
          old='out, n = re.subn(pattern, replacement, text, count=1, flags=flags)'
          new='out, n = re.subn(pattern, lambda _m: replacement, text, count=1, flags=flags)'
          if old not in s:
              raise SystemExit('replacement helper pattern missing')
          s=s.replace(old,new,1)
          old_pat=r'''r"function signalSummary\\(scan\\) \\{[\\s\\S]*?\\n\\}\\nasync function chooseAssignment\\(env, scan\\) \\{[\\s\\S]*?\\n\\}\\nfunction distinctSources\\(items\\) \\{[\\s\\S]*?\\n\\}\\nfunction validateAssignment\\(assignment, scan\\) \\{[\\s\\S]*?\\n\\}\\n\\nasync function runResearch"'''
          new_pat=r'''r"function signalSummary\\(scan\\) \\{[\\s\\S]*?\\n\\}\\nasync function chooseAssignment\\(env, scan\\) \\{[\\s\\S]*?\\n\\}\\nfunction distinctSources\\(items\\) \\{[^\\n]*\\}\\nfunction validateAssignment\\(assignment, scan\\) \\{[\\s\\S]*?\\n\\}\\n\\nasync function runResearch"'''
          if old_pat not in s:
              raise SystemExit('shortlist regex pattern missing')
          s=s.replace(old_pat,new_pat,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply refactor
        run: python scripts/_apply_scan_refactor_once.py
      - name: Syntax checks
        run: |
          node --check cloudflare/newsdesk/src/index.js
          node --check cloudflare/newsdesk/src/editorial.js
          python -m py_compile scripts/sync_cloudflare_editorial.py
      - name: Commit refactor
        run: |
          set -euo pipefail
          git config user.name 'morgentidende-refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: broaden and simplify scan discovery'
          git pull --rebase origin main
          git push origin main
