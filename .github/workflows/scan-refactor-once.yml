name: Finalize scan refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scan-refactor-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morgentidende-main-writes
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --ff-only origin main
      - name: Remove obsolete duplicate declaration
        run: sed -i '14d' cloudflare/newsdesk/src/editorial.js
      - name: Validate JavaScript
        run: |
          node --check cloudflare/newsdesk/src/index.js
          node --check cloudflare/newsdesk/src/editorial.js
      - name: Commit source correction
        run: |
          git config user.name 'morgentidende-refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/newsdesk/src/editorial.js
          git commit -m 'fix: finalize refactored newsdesk source'
          git pull --rebase origin main
          git push origin main
