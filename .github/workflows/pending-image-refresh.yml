name: Refresh pending news heroes

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morgentidende-editorial-import
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Self-test pending image refresh
        run: python scripts/refresh_pending_images.py --self-test
      - name: Search lawful documentary replacements
        run: python scripts/refresh_pending_images.py --limit 5
      - name: Validate and rebuild
        run: |
          python scripts/quality_gate.py --prebuild
          python scripts/pipeline_v2_gate.py
          python scripts/prepublish_surface_qa.py
          python scripts/build_all.py
      - name: Commit replacements
        run: |
          set -euo pipefail
          git config user.name 'morgentidende-media-scout'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles reports/editorial/approvals content/frontpage.json docs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Ingen pending hero fik et bedre foto'
            exit 0
          fi
          git commit -m 'media: replace pending hero with documentary photo'
          git pull --rebase origin main
          python scripts/build_all.py
          git add docs content/frontpage.json 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          git push origin main
