name: Refresh pending news heroes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morgentidende-pending-image-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Search lawful documentary replacements
        run: python scripts/refresh_pending_images.py --limit 5
      - name: Validate changed media only
        run: python scripts/prepublish_surface_qa.py
      - name: Commit source-of-truth media replacements
        run: |
          set -euo pipefail
          git config user.name 'morgentidende-media-scout'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles reports/editorial/approvals content/frontpage.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Ingen pending hero fik et bedre foto'
            exit 0
          fi
          git commit -m 'media: replace pending hero with documentary photo'
          git pull --rebase origin main
          git push origin main
