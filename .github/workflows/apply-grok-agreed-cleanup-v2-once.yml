name: Apply agreed Grok cleanup v2 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-grok-agreed-cleanup-v2-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply agreed cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          root=Path('.')
          ep=root/'cloudflare/newsdesk/src/editorial.js'; js=ep.read_text(encoding='utf-8')

          old='''const assignmentSchema = {
            type: "object", properties: {
              decision: { type: "string", enum: ["research", "watch", "drop"] }, title_hint: { type: "string" },
              category: { type: "string", enum: CATEGORIES }, weight: { type: "string", enum: ["A", "B", "C", "D"] },
              signal_indexes: { type: "array", items: { type: "integer" }, minItems: 0, maxItems: 3 },
              rationale: { type: "string" }, core_question: { type: "string" },
              story_location: { type: "object", properties: {
                country: { type: "string" }, country_code: { type: "string" },
                primary_language: { type: "string" }, primary_language_code: { type: "string" },
                place_names_local: { type: "array", maxItems: 6, items: { type: "string" } },
                place_names_english: { type: "array", maxItems: 6, items: { type: "string" } },
                transliterations: { type: "array", maxItems: 6, items: { type: "string" } },
                hero_queries_local: { type: "array", maxItems: 3, items: { type: "string" } },
                hero_queries_english: { type: "array", maxItems: 3, items: { type: "string" } },
                hero_queries_transliterated: { type: "array", maxItems: 3, items: { type: "string" } },
              }, required: ["country", "country_code", "primary_language", "primary_language_code", "place_names_local", "place_names_english", "transliterations", "hero_queries_local", "hero_queries_english", "hero_queries_transliterated"] },
            }, required: ["decision", "title_hint", "category", "weight", "signal_indexes", "rationale", "core_question", "story_location"],
          };'''
          new='''const assignmentSchema = {
            type: "object", properties: {
              decision: { type: "string", enum: ["research", "watch", "drop"] }, title_hint: { type: "string" },
              category: { type: "string", enum: CATEGORIES }, weight: { type: "string", enum: ["A", "B", "C", "D"] },
              signal_indexes: { type: "array", items: { type: "integer" }, minItems: 0, maxItems: 3 },
              rationale: { type: "string" }, core_question: { type: "string" },
              story_location: { type: "object", properties: {
                country: { type: "string" }, country_code: { type: "string" },
                place_names_local: { type: "array", maxItems: 4, items: { type: "string" } },
                place_names_english: { type: "array", maxItems: 4, items: { type: "string" } },
              }, required: ["country", "country_code", "place_names_local", "place_names_english"] },
            }, required: ["decision", "title_hint", "category", "weight", "signal_indexes", "rationale", "core_question", "story_location"],
          };'''
          assert old in js; js=js.replace(old,new,1)
          old='}, required: ["decision", "rationale", "core_question", "right_of_reply_required", "conflict_present", "contradictions", "candidate_claims"],\n};'
          assert old in js; js=js.replace(old,'}, required: ["decision", "rationale", "core_question", "conflict_present", "contradictions", "candidate_claims"],\n};',1)
          pat=re.compile(r'  const system = `Du er Morgentidendes første Nyhedsdesk\.[^`]+?Svar ultrakort\.`;')
          repl='  const system = `Du er Morgentidendes første Nyhedsdesk. Vælg ét konkret research-frø. RESEARCH er standard ved reel nyhedsværdi, originalitet, offentlig betydning eller tydelig redaktionel relevans; tynd dokumentation er Researchs problem, ikke en afvisningsgrund. WATCH kun hvis nyhedskrogen/aktualiteten endnu er uklar. DROP kun ved klar dublet, gammel/triviel sag, rent holdningsstof uden nyhedskrog eller åbenlys spam. discovery_only må udløse Research, men er aldrig dokumentation. Sæt kategori og A-D-vægt. Angiv kun det primære land og op til fire relevante stednavne på lokalt/engelsk navn, når de er tydelige; ellers brug unknown/tomme arrays. Media laver selv billedsøgninger. Svar ultrakort.`;'
          js,n=pat.subn(repl,js,count=1); assert n==1
          old='''  const supplied = [
              ...(Array.isArray(loc.hero_queries_local) ? loc.hero_queries_local : []),
              ...(Array.isArray(loc.hero_queries_transliterated) ? loc.hero_queries_transliterated : []),
              ...(Array.isArray(loc.hero_queries_english) ? loc.hero_queries_english : []),
            ].map((x) => String(x || "").trim()).filter((x) => x.length >= 2);'''
          new='''  const supplied = [
              ...(Array.isArray(loc.place_names_local) ? loc.place_names_local : []),
              ...(Array.isArray(loc.place_names_english) ? loc.place_names_english : []),
            ].map((x) => String(x || "").trim()).filter((x) => x.length >= 2);'''
          assert old in js; js=js.replace(old,new,1)
          js=js.replace('    ...(Array.isArray(loc.transliterations) ? loc.transliterations : []),\n','',1)
          old='''const articleSchema = { type: "object", properties: {
            title: { type: "string" }, standfirst: { type: "string" },
            body: { type: "array", minItems: 1, maxItems: 14, items: { type: "object", properties: {
              type: { type: "string", enum: ["p", "h2", "h3"] }, text: { type: "string" },
            }, required: ["type", "text"] } },
            seo_title: { type: "string" }, seo_description: { type: "string" },
          }, required: ["title", "standfirst", "body", "seo_title", "seo_description"] };'''
          new='''const articleSchema = { type: "object", properties: {
            title: { type: "string" }, standfirst: { type: "string" },
            body: { type: "array", minItems: 1, maxItems: 14, items: { type: "object", properties: {
              type: { type: "string", enum: ["p", "h2", "h3"] }, text: { type: "string" },
            }, required: ["type", "text"] } },
          }, required: ["title", "standfirst", "body"] };'''
          assert old in js; js=js.replace(old,new,1)
          old='Flag alvorlige belastende påstande via right_of_reply_required, men brug ikke flaget som stopregel.'
          assert old in js; js=js.replace(old,'Sæt kun right_of_reply_required=true ved en konkret alvorlig belastende påstand, hvor fairness faktisk er relevant; ellers kan feltet udelades. Flaget er aldrig en automatisk ventetid eller stopregel.',1)
          assert '    seo: { title: article.seo_title, description: article.seo_description, canonical: null },' in js
          js=js.replace('    seo: { title: article.seo_title, description: article.seo_description, canonical: null },','    seo: { title: article.title, description: article.standfirst, canonical: null },',1)
          old='  const approval = { schema_version: 1, status: "pass", story_id: storyId, article_slug: slug, checked_at: startedAt, gates: { language: "pass", ethics: "pass", image: "pass", final_editor: "pass" }, final_editor_mode: review.mode || "ai", editorial_snapshot: approvalSnapshot };'
          assert old in js; js=js.replace(old,'  const approval = { schema_version: 1, status: "pass", story_id: storyId, article_slug: slug, checked_at: startedAt, final_editor_mode: review.mode || "ai", editorial_snapshot: approvalSnapshot };',1)
          ep.write_text(js,encoding='utf-8')

          qp=root/'scripts/quality_gate.py'; q=qp.read_text(encoding='utf-8')
          q=q.replace('''                src = sources.get(sid)
                          if not src:
                              err(f"{path.name}: claim {claim_id} peger på ukendt source_id {sid}")
                          elif not str(src.get("source_group", "")).strip():
                              err(f"{path.name}: source {sid} mangler source_group")''','''                if not sources.get(sid):
                              err(f"{path.name}: claim {claim_id} peger på ukendt source_id {sid}")''',1)
          assert 'mangler source_group' not in q; qp.write_text(q,encoding='utf-8')

          rp=root/'scripts/reapprove_media_change.py'; r=rp.read_text(encoding='utf-8')
          r,n=re.subn(r'    new_approval\["gates"\] = \{\n(?:        .*\n)+?    \}\n','',r,count=1); assert n==1
          rp.write_text(r,encoding='utf-8')

          feedback='''#!/usr/bin/env python3
          from __future__ import annotations
          import json
          from collections import Counter
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          ROOT=Path(__file__).resolve().parents[1]
          ATTEMPTS=ROOT/'reports'/'editorial'/'publication-attempts.jsonl'; HEALTH=ROOT/'reports'/'editorial'/'pipeline-health.json'; OUT=ROOT/'reports'/'editorial'/'pipeline-feedback.json'; DK=ZoneInfo('Europe/Copenhagen')
          CANONICAL_FLOW=['scan','newsdesk','research','fact_check','journalist','media','final_editor','release']
          def load_json(path,default):
              try:return json.loads(path.read_text(encoding='utf-8')) if path.exists() else default
              except Exception:return default
          def load_attempts():
              rows=[]
              if not ATTEMPTS.exists():return rows
              for line in ATTEMPTS.read_text(encoding='utf-8').splitlines():
                  try:rows.append(json.loads(line))
                  except Exception:pass
              return rows
          def parse_dt(value):
              try:return datetime.fromisoformat(str(value).replace('Z','+00:00')).astimezone(timezone.utc)
              except Exception:return None
          def classify(row):
              reason=str(row.get('reason') or '').lower(); stage=str(row.get('stage') or '').lower()
              if any(x in reason for x in ['quota','rate limit','timeout','runtime-error','connection','network']):return 'infrastructure','Ret drift eller genkør; ændr ikke redaktionelle krav.'
              if 'language' in reason or 'sprog' in reason:return 'repairable','Lokal sprogreparation; genresearch ikke.'
              if 'seo' in reason or 'metadata' in reason:return 'technical','Reparer deterministisk; må ikke være redaktionelt stop.'
              if 'image' in reason or 'billede' in reason or stage=='media':return 'media','Send kun til Media; tekstkæden skal ikke genkøres.'
              if 'fact' in reason or 'claim' in reason or 'source' in reason or 'kilde' in reason or stage=='research':return 'evidence','Send kun konkret evidensmangel til Research/Fact checker.'
              if 'ethic' in reason or 'etik' in reason or 'fairness' in reason or 'forelægg' in reason:return 'fairness','Løs konkret fairnessproblem lokalt; ingen automatisk deadline eller generel gate.'
              if 'final' in reason:return 'editorial','Skeln mellem lokal tekstreparation og reel evidensmangel.'
              return 'review','Diagnostisk efterkontrol; opret ikke nye gates.'
          def stage_from_reason(row):
              stage=str(row.get('stage') or '').lower().replace('-','_')
              if stage:return stage
              reason=str(row.get('reason') or '').lower()
              for key in ['newsdesk','research','fact_check','journalist','language','ethics','media','final_editor','release']:
                  if key.replace('_',' ') in reason or key in reason:return key
              return 'unknown'
          def main():
              now=datetime.now(timezone.utc); day=now.astimezone(DK).date(); attempts=load_attempts(); rejected=[x for x in attempts if str(x.get('status') or '').lower() not in {'approved','published','pass'}]
              today=[x for x in rejected if parse_dt(x.get('at')) and parse_dt(x.get('at')).astimezone(DK).date()==day]; last7=[x for x in rejected if parse_dt(x.get('at')) and parse_dt(x.get('at'))>=now-timedelta(days=7)]
              reviews=[]
              for x in sorted(today,key=lambda r:str(r.get('at') or ''),reverse=True):
                  cls,assessment=classify(x); reviews.append({'at':x.get('at'),'slug':x.get('slug'),'title':x.get('title'),'stage':stage_from_reason(x),'reason':x.get('reason'),'class':cls,'assessment':assessment})
              counts=Counter(stage_from_reason(x) for x in last7); health=load_json(HEALTH,{'articles':[]}); blockers=[{'slug':a.get('slug'),'title':a.get('title'),'resume_from':a.get('resume_from'),'reasons':a.get('reasons') or []} for a in health.get('articles') or [] if a.get('reasons')]
              result={'schema_version':2,'generated_at':now.isoformat().replace('+00:00','Z'),'date_dk':day.isoformat(),'policy':{'diagnostic_only':True,'automatic_rule_changes':False,'principle':'Færre fejl, færre afvisninger og færre neurons pr. godkendt artikel. Feedback må ikke skabe nye gates.'},'canonical_flow':CANONICAL_FLOW,'today':{'rejections':len(today),'reviews':reviews},'last7_stage_counts':dict(sorted(counts.items())),'current_blockers':blockers}
              OUT.parent.mkdir(parents=True,exist_ok=True); OUT.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8'); print(f'Pipeline feedback: {len(today)} rejection reviews; diagnostic only')
          if __name__=='__main__':main()
          '''
          (root/'scripts/pipeline_feedback.py').write_text(textwrap.dedent(feedback),encoding='utf-8')

          tp=root/'scripts/test_hybrid_runtime.py'; t=tp.read_text(encoding='utf-8')
          start=t.index('    thresholds = json.loads('); end=t.index('    dispatch = load_module',start)
          t=t[:start]+'    assert not (ROOT / "config" / "pipeline-thresholds.json").exists(), "Legacy parallel threshold policy must stay removed"\n\n'+t[end:]
          t=t.replace('ROOT / "scripts" / "editorial_dispatch_gate.py"','ROOT / "scripts" / "editorial_cycle_selector.py"')
          stale=[
            "        'function highRiskFactClaim(assignment, research, claim)',\n",
            "        'function deterministicFinalReview(assignment, dossier, article)',\n",
            "        'function requiresAiFinalReview(assignment, dossier, article)',\n",
            "        'dossier?.right_of_reply_required',\n",
            "        'const aiFinalRequired = requiresAiFinalReview',\n",
            "        'Et claim kan få Verified på baggrund af én relevant autoritativ kilde',\n",
            "        'Ét verificeret bærende claim er nok til en kort one-claim-artikel',\n",
            "        'Din overordnede publish/hold-vurdering er rådgivende',\n",
            "    assert 'required: Boolean(dossier.right_of_reply_required)' in js, \"Ledger must preserve Research right-of-reply flag\"\n",
          ]
          for s in stale:t=t.replace(s,'')
          marker="    assert 'hero_alt' not in js.split('const articleSchema', 1)[1].split('const finalSchema', 1)[0], \"Journalist schema must not spend output tokens on hero_alt\"\n"
          assert marker in t
          t=t.replace(marker,marker+"    assert 'seo_title' not in js.split('const articleSchema', 1)[1].split('const finalSchema', 1)[0], \"Journalist schema must not spend output tokens on SEO\"\n    assert 'hero_queries_' not in js, \"Newsdesk must not spend output tokens on hero search queries\"\n")
          tp.write_text(t,encoding='utf-8')
          th=root/'config/pipeline-thresholds.json'; assert th.exists(); th.unlink()
          PY
      - name: Validate
        run: |
          set -euo pipefail
          node --check cloudflare/newsdesk/src/editorial.js
          python -m py_compile scripts/quality_gate.py scripts/reapprove_media_change.py scripts/pipeline_feedback.py scripts/test_hybrid_runtime.py
          python scripts/test_hybrid_runtime.py
          python scripts/quality_gate.py --prebuild
          python scripts/pipeline_feedback.py
          git diff --check
          ! git grep -n 'pipeline-thresholds' -- ':!scripts/test_hybrid_runtime.py' ':!.github/workflows/apply-grok-agreed-cleanup-once.yml' ':!.github/workflows/apply-grok-agreed-cleanup-v2-once.yml'
          ! git grep -n 'mangler source_group' scripts/quality_gate.py
      - name: Remove one-shot workflows
        if: always()
        run: rm -f .github/workflows/apply-grok-agreed-cleanup-once.yml .github/workflows/apply-grok-agreed-cleanup-v2-once.yml
      - name: Commit
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'refactor: apply agreed editorial simplifications'
          git push
