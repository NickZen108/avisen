name: Post-deploy guard

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morgentidende-main-writes
  cancel-in-progress: false

jobs:
  smoke-and-safe-rollback:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'rollback:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for Pages and test internal site health
        id: smoke
        continue-on-error: true
        run: |
          set -u
          sleep 45
          for attempt in 1 2 3; do
            echo "Smoke attempt $attempt"
            if python scripts/live_qa.py --strict-internal --report /tmp/post-deploy.md; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1
      - name: Record failure and safely roll back latest generated publish
        if: ${{ steps.smoke.outcome == 'failure' && github.event_name == 'push' }}
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          SUBJECT=$(git show -s --format=%s "$TARGET_SHA")
          if [[ "$SUBJECT" != "publish: build structured edition" ]]; then
            echo "Live-kritisk fejl, men target er ikke et genereret publisher-commit. Ingen automatisk rollback."
            cat /tmp/post-deploy.md || true
            exit 1
          fi

          LATEST_DOCS_SHA=$(git log -1 --format=%H -- docs/)
          if [ "$LATEST_DOCS_SHA" != "$TARGET_SHA" ]; then
            echo "Et nyere docs-commit findes allerede; gammelt publish rulles ikke tilbage."
            cat /tmp/post-deploy.md || true
            exit 1
          fi

          mkdir -p reports/qa
          cp /tmp/post-deploy.md reports/qa/rollback-latest.md
          git config user.name "morgentidende-safety"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-commit "$TARGET_SHA"
          git add reports/qa/rollback-latest.md
          git commit -m "rollback: failed post-deploy internal smoke test"
          git push
          echo "Publisher-output blev rullet tilbage efter tre interne smoke-test-fejl."
