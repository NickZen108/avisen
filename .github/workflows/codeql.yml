name: CodeQL
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'docs/**/*.js'
      - 'scripts/**/*.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'docs/**/*.js'
      - 'scripts/**/*.mjs'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
