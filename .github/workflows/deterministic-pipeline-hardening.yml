name: Deterministic pipeline hardening

on:
  push:
    branches: [main]
    paths:
      - 'scripts/deterministic_pipeline_hardening.py'
      - '.github/workflows/deterministic-pipeline-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --ff-only origin main
      - run: python scripts/deterministic_pipeline_hardening.py
      - run: node --check cloudflare/newsdesk/src/editorial.js && node --check cloudflare/newsdesk/src/index.js
      - name: Commit runtime changes
        run: |
          set -euo pipefail
          if git diff --quiet -- cloudflare/newsdesk/src/editorial.js cloudflare/newsdesk/src/index.js; then exit 0; fi
          git config user.name 'morgentidende-pipeline-hardening'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/newsdesk/src/editorial.js cloudflare/newsdesk/src/index.js
          git commit -m 'refactor: deterministic source provenance and watch TTLs'
          git pull --rebase origin main
          git push origin main
