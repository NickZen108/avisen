name: Simplify selector and coverage once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplify-selector-and-coverage-once.yml'

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply simplification
        run: python scripts/maintenance_remove_dispatch_gate_once.py
      - name: Validate
        run: |
          python -m py_compile scripts/editorial_cycle_selector.py scripts/sync_cloudflare_editorial.py scripts/log_publication_attempt.py
          python scripts/editorial_cycle_selector.py --self-test
          python scripts/editorial_sync_contract_test.py
          git diff --check
      - name: Remove one-shot files
        run: rm scripts/maintenance_remove_dispatch_gate_once.py .github/workflows/simplify-selector-and-coverage-once.yml
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: rename cycle selector and remove coverage blocking'
          git pull --rebase origin main
          git push origin main
