name: Manual burst 3 immediate 2026-09-02

# trigger: 2026-09-02T20:16Z
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-burst-4x10-20260902.yml'

permissions:
  actions: write
  contents: read

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Run three fresh editorial slots back-to-back
        shell: bash
        run: |
          set -euo pipefail

          run_and_wait() {
            local workflow="$1"
            shift
            local marker
            marker=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run "$workflow" --ref main "$@"
            sleep 3
            local rid=""
            for _ in $(seq 1 20); do
              rid=$(gh run list --workflow "$workflow" --event workflow_dispatch --limit 10 --json databaseId,createdAt \
                --jq ".[] | select(.createdAt >= \"$marker\") | .databaseId" | head -n1 || true)
              if [ -n "$rid" ]; then
                break
              fi
              sleep 3
            done
            if [ -z "$rid" ]; then
              echo "Kunne ikke finde dispatch-run for $workflow"
              return 1
            fi
            echo "Waiting for $workflow run $rid"
            gh run watch "$rid" --exit-status
          }

          for slot in 1 2 3; do
            echo "=== Burst slot $slot/3 start $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

            # Refresh candidate pool before each article.
            run_and_wait breaking-scan.yml

            # Up to three distinct candidates may be tried; stop on first approved/publicable article.
            run_and_wait cloudflare-editorial-sync.yml -f cycles=3

            echo "=== Burst slot $slot/3 complete $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "Starting next slot immediately."
          done
