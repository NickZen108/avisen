name: Apply semantic fact-check simplification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-authoritative-single-source-policy.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Sync latest main
        run: git fetch origin main && git reset --hard origin/main
      - name: Simplify semantic fact-check prompts
        run: |
          python scripts/simplify_semantic_factcheck_once.py
          node --check cloudflare/newsdesk/src/editorial.js
      - name: Commit change
        run: |
          git config user.name "morgentidende-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/newsdesk/src/editorial.js
          git commit -m "factcheck: use holistic semantic comparison"
          git push
      - name: Deploy Newsdesk
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh workflow run cloudflare-newsdesk-deploy.yml --ref main
