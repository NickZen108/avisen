name: Burst orchestrator 3x10
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-authoritative-single-source-policy.yml'
permissions:
  actions: write
  contents: read
jobs:
  burst:
    runs-on: ubuntu-latest
    steps:
      - name: Run three publication slots ten minutes apart
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          run_and_wait() {
            workflow="$1"; shift
            before=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if ! gh workflow run "$workflow" --ref main "$@"; then
              echo "Kunne ikke starte $workflow"
              return 1
            fi
            run_id=""
            for attempt in $(seq 1 30); do
              run_id=$(gh run list --workflow "$workflow" --branch main --limit 20 --json databaseId,createdAt,event --jq ".[] | select(.event == \"workflow_dispatch\" and .createdAt >= \"$before\") | .databaseId" | head -n1)
              [ -n "$run_id" ] && break
              sleep 2
            done
            if [ -z "$run_id" ]; then
              echo "Fandt ikke child-run for $workflow"
              return 1
            fi
            echo "$workflow run_id=$run_id"
            gh run watch "$run_id" --exit-status || return 1
          }

          for slot in 1 2 3; do
            slot_start=$(date +%s)
            echo "=== BURST SLOT $slot/3 $(date -u +%FT%TZ) ==="
            run_and_wait breaking-scan.yml || echo "Slot $slot: Breaking Scan fejlede; fortsætter."
            run_and_wait cloudflare-editorial-sync.yml -f cycles=3 || echo "Slot $slot: Editorial Sync fejlede; fortsætter til næste slot."
            if [ "$slot" -lt 3 ]; then
              elapsed=$(( $(date +%s) - slot_start ))
              wait=$(( 600 - elapsed ))
              if [ "$wait" -gt 0 ]; then
                echo "Venter $wait sekunder så næste slot starter ca. 10 minutter efter dette slots start."
                sleep "$wait"
              else
                echo "Slot tog mindst 10 minutter; starter næste straks."
              fi
            fi
          done
