name: Burst orchestrator 4x10
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-authoritative-single-source-policy.yml'
permissions:
  actions: write
  contents: read
jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Run four publication slots ten minutes apart
        shell: bash
        run: |
          set -u

          run_and_wait() {
            workflow="$1"
            shift
            marker=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if ! gh workflow run "$workflow" --ref main "$@"; then
              echo "Dispatch failed for $workflow; continuing burst."
              return 0
            fi
            sleep 3
            rid=""
            for n in $(seq 1 20); do
              rid=$(gh run list --workflow "$workflow" --event workflow_dispatch --limit 10 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$marker\") | .databaseId" | head -n1 || true)
              if [ -n "$rid" ]; then
                break
              fi
              sleep 3
            done
            if [ -z "$rid" ]; then
              echo "Could not identify $workflow run; continuing burst."
              return 0
            fi
            echo "Waiting for $workflow run $rid"
            if ! gh run watch "$rid" --exit-status; then
              echo "$workflow run $rid failed; continuing to next burst step/slot."
            fi
            return 0
          }

          for slot in 1 2 3 4; do
            slot_start=$(date +%s)
            echo "=== SLOT $slot/4 $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            run_and_wait breaking-scan.yml
            run_and_wait cloudflare-editorial-sync.yml -f cycles=3
            if [ "$slot" -lt 4 ]; then
              elapsed=$(( $(date +%s) - slot_start ))
              delay=$(( 600 - elapsed ))
              if [ "$delay" -gt 0 ]; then
                echo "Sleeping ${delay}s before next slot."
                sleep "$delay"
              else
                echo "Slot exceeded ten minutes; starting next slot now."
              fi
            fi
          done
