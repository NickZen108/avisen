name: Apply standfirst repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-authoritative-single-source-policy.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Sync latest main
        run: git fetch origin main && git reset --hard origin/main
      - name: Apply standfirst repair
        run: |
          python scripts/apply_standfirst_rule_once.py
          node --check cloudflare/newsdesk/src/editorial.js
          python -m json.tool content/articles/2026-09-02-tyskland-og-rusland-i-konflikt-efter-droneangreb.json >/dev/null
          python -m json.tool reports/editorial/approvals/2026-09-02-tyskland-og-rusland-i-konflikt-efter-droneangreb.json >/dev/null
      - name: Commit repair
        id: commit
        run: |
          git config user.name "morgentidende-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/newsdesk/src/editorial.js content/articles/2026-09-02-tyskland-og-rusland-i-konflikt-efter-droneangreb.json reports/editorial/approvals/2026-09-02-tyskland-og-rusland-i-konflikt-efter-droneangreb.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "fix: keep standfirst short and focused"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Newsdesk
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh workflow run cloudflare-newsdesk-deploy.yml --ref main
      - name: Run quality gates
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh workflow run quality-gates.yml --ref main
