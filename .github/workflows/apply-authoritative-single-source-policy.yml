name: Apply global language house rules
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-authoritative-single-source-policy.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Sync latest main
        run: git fetch origin main && git reset --hard origin/main
      - name: Apply language house rules
        run: |
          echo 'language-house-rule-v3'
          python scripts/apply_language_house_rules_once.py
          node --check cloudflare/newsdesk/src/editorial.js
      - name: Commit changes
        run: |
          git config user.name "morgentidende-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HUSREGLER.md STYLE.md cloudflare/newsdesk/src/editorial.js
          git commit -m "language: normalize research claims to Danish"
          git push
      - name: Deploy Newsdesk
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh workflow run cloudflare-newsdesk-deploy.yml --ref main
