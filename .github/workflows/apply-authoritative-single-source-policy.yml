name: Apply language repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-authoritative-single-source-policy.yml'
      - '.github/language-repair-trigger'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Sync latest main
        run: git fetch origin main && git reset --hard origin/main
      - name: Apply existing language repair step
        run: |
          python scripts/apply_language_repair_once.py
          node --check cloudflare/newsdesk/src/editorial.js
          python -m json.tool content/articles/2026-09-02-dykolycka-i-lerkils-hamn-en-person-er-blevet-allvarligt-skadet.json >/dev/null
          python -m json.tool reports/editorial/approvals/2026-09-02-dykolycka-i-lerkils-hamn-en-person-er-blevet-allvarligt-skadet.json >/dev/null
      - name: Commit repair
        id: commit
        run: |
          git config user.name "morgentidende-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/newsdesk/src/editorial.js content/articles/2026-09-02-dykolycka-i-lerkils-hamn-en-person-er-blevet-allvarligt-skadet.json reports/editorial/approvals/2026-09-02-dykolycka-i-lerkils-hamn-en-person-er-blevet-allvarligt-skadet.json
          git commit -m "fix: run language repair before final review"
          git push
      - name: Deploy Newsdesk
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh workflow run cloudflare-newsdesk-deploy.yml --ref main
      - name: Run quality gates
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh workflow run quality-gates.yml --ref main
