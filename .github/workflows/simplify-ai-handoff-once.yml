name: Simplify AI handoff schemas once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/simplify-ai-handoff-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Simplify Research and Fact checker structured handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/newsdesk/src/editorial.js')
          s=p.read_text(encoding='utf-8')
          old='''const researchSchema = {
  type: "object", properties: {
    decision: { type: "string", enum: ["continue", "watch"] }, rationale: { type: "string" }, core_question: { type: "string" },
    right_of_reply_required: { type: "boolean" }, conflict_present: { type: "boolean" }, contradictions: { type: "array", items: { type: "string" } },
    candidate_claims: { type: "array", minItems: 1, maxItems: 8, items: { type: "object", properties: {
      id: { type: "string" }, claim: { type: "string" }, source_indexes: { type: "array", items: { type: "integer" }, minItems: 1 },
      notes: { type: "string" },
    }, required: ["id", "claim", "source_indexes", "notes"] } },
  }, required: ["decision", "rationale", "core_question", "conflict_present", "contradictions", "candidate_claims"],
};

const factCheckSchema = {
  type: "object", properties: {
    contradictions: { type: "array", items: { type: "string" } },
    claims: { type: "array", minItems: 1, maxItems: 12, items: { type: "object", properties: {
      id: { type: "string" }, claim: { type: "string" }, source_indexes: { type: "array", items: { type: "integer" }, minItems: 1 },
      status: { type: "string", enum: ["verified", "uncertain", "rejected"] }, notes: { type: "string" },
    }, required: ["id", "claim", "source_indexes", "status", "notes"] } },
  }, required: ["contradictions", "claims"],
};'''
          new='''const researchSchema = {
  type: "object", properties: {
    decision: { type: "string", enum: ["continue", "watch"] },
    candidate_claims: { type: "array", minItems: 1, maxItems: 8, items: { type: "object", properties: {
      id: { type: "string" }, claim: { type: "string" }, source_indexes: { type: "array", items: { type: "integer" }, minItems: 1 },
    }, required: ["id", "claim", "source_indexes"] } },
    conflict_present: { type: "boolean" },
    right_of_reply_required: { type: "boolean" },
    contradictions: { type: "array", items: { type: "string" } },
  }, required: ["decision", "candidate_claims"],
};

const factCheckSchema = {
  type: "object", properties: {
    claims: { type: "array", minItems: 1, maxItems: 12, items: { type: "object", properties: {
      id: { type: "string" }, claim: { type: "string" }, source_indexes: { type: "array", items: { type: "integer" }, minItems: 1 },
      status: { type: "string", enum: ["verified", "uncertain", "rejected"] },
    }, required: ["id", "claim", "source_indexes", "status"] } },
    contradictions: { type: "array", items: { type: "string" } },
  }, required: ["claims"],
};'''
          assert old in s, 'schema block changed unexpectedly'
          s=s.replace(old,new,1)
          old_prompt='''  const system = `Du er Research på Morgentidende. Lav et kompakt evidens-kort til Fact checker; vurder ikke nyhedsværdi igen og fæld ikke den endelige sandhedsdom. Kortlæg 1-6 bærende kandidat-claims med præcise source_indexes. Notér kun reelle modsigelser, væsentlige forbehold og nødvendig kontekst. En primærkilde er værdifuld, men du skal ikke kræve et bestemt antal medier. Hvis mindst ét brugbart claim kan kildebelægges, vælg continue; watch kun hvis materialet reelt ikke giver noget kontrollerbart. Sæt kun right_of_reply_required=true ved en konkret alvorlig belastende påstand, hvor fairness faktisk er relevant; ellers kan feltet udelades. Flaget er aldrig en automatisk ventetid eller stopregel. Sæt conflict_present=true kun når historien faktisk rummer en relevant politisk, juridisk, faglig eller parts-konflikt; almindelige hændelsesfakta/statistik kræver ikke kunstig pluralisme. Skriv alle kandidat-claims på idiomatisk dansk, også når originalkilden er norsk, svensk eller et andet sprog. Norske bokmåls-/nynorskformer og svenske ord eller bøjningsformer må ikke føres videre som dansk. Ved oversættelse eller parafrase skal originalens samlede betydning bevares præcist. Opfind intet.`;'''
          new_prompt='''  const system = `Du er Research på Morgentidende. Vurdér selv materialet og aflever kun det, Fact checker behøver: decision og 1-6 bærende candidate_claims med præcise source_indexes. Hvis mindst ét brugbart claim kan kildebelægges, vælg continue; watch kun hvis materialet reelt ikke giver noget kontrollerbart. Tilføj kun conflict_present, right_of_reply_required eller contradictions når de faktisk er relevante; de er valgfrie og må aldrig skabe en automatisk ventetid eller stopregel. Kræv ikke et bestemt antal medier. Skriv kandidat-claims på idiomatisk dansk, også når originalkilden er norsk, svensk eller et andet sprog, og bevar betydningen præcist. Opfind intet.`;'''
          assert old_prompt in s, 'research prompt changed unexpectedly'
          s=s.replace(old_prompt,new_prompt,1)
          old_payload='''    research: { core_question: research.core_question, rationale: research.rationale, contradictions: research.contradictions, candidate_claims: research.candidate_claims },'''
          new_payload='''    research: { candidate_claims: research.candidate_claims, contradictions: research.contradictions || [] },'''
          assert old_payload in s
          s=s.replace(old_payload,new_payload,1)
          old_after='''  fact.researched = research.researched;
  fact.core_question = research.core_question || assignment.core_question;
  fact.right_of_reply_required = research.right_of_reply_required;
  fact.conflict_present = Boolean(research.conflict_present);'''
          new_after='''  fact.researched = research.researched;
  fact.core_question = assignment.core_question;
  fact.contradictions = Array.isArray(fact.contradictions) ? fact.contradictions : (Array.isArray(research.contradictions) ? research.contradictions : []);
  fact.right_of_reply_required = Boolean(research.right_of_reply_required);
  fact.conflict_present = Boolean(research.conflict_present);'''
          assert old_after in s
          s=s.replace(old_after,new_after,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check cloudflare/newsdesk/src/editorial.js
          python scripts/test_hybrid_runtime.py
          python scripts/quality_gate.py
          git diff --check
      - name: Commit runtime simplification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/newsdesk/src/editorial.js
          git commit -m 'refactor: simplify Research and Fact checker handoff' || exit 0
          git push origin main
