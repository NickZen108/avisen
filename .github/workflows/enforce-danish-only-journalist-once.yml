name: Enforce Danish-only journalist rule once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/enforce-danish-only-journalist-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Make Danish-only rule explicit in Journalist prompt
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/newsdesk/src/editorial.js')
          s=p.read_text(encoding='utf-8')
          old='Du er journalist på Morgentidende. ${destinationBrief} Brug KUN verified claims. Skriv præcist, levende og idiomatisk dansk;'
          new='Du er journalist på Morgentidende. ${destinationBrief} HÅRD REGEL: Al redaktionel tekst skal være på dansk, inklusive rubrik, manchet, brødtekst, mellemoverskrifter og citater. Citater på andre sprog skal oversættes loyalt til naturligt dansk med samme betydning og forbehold. Kun egennavne, officielle navne og produkt-/værknavne må stå på originalsproget. Brug KUN verified claims. Skriv præcist, levende og idiomatisk dansk;'
          assert old in s
          s=s.replace(old,new,1)
          old2='Du er Morgentidendes uafhængige slutredaktør. Lav ét kort slutcheck af den færdige artikel mod de ALLEREDE verificerede claims;'
          new2='Du er Morgentidendes uafhængige slutredaktør. HÅRD SPROGREGEL: al redaktionel tekst og alle citater skal være på dansk; citater fra andre sprog skal være loyalt oversat. Kun egennavne, officielle navne og produkt-/værknavne må stå på originalsproget. Lav ét kort slutcheck af den færdige artikel mod de ALLEREDE verificerede claims;'
          assert old2 in s
          s=s.replace(old2,new2,1)
          old3='Fjern alle norske/svenske almindelige ord og bøjninger; egennavne og officielle navne bevares.`'
          new3='Fjern alle norske/svenske/engelske almindelige ord og bøjninger. Oversæt også fremmedsprogede citater loyalt til dansk. Kun egennavne, officielle navne og produkt-/værknavne bevares på originalsproget.`'
          assert old3 in s
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check cloudflare/newsdesk/src/editorial.js
          python scripts/test_hybrid_runtime.py
      - name: Commit runtime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/newsdesk/src/editorial.js
          git commit -m 'style: enforce Danish-only journalist output' || exit 0
          git push origin main
