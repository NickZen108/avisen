name: One-shot structured schema cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-structured-schema-fix.yml']
permissions: {contents: write}
concurrency:
  group: morgentidende-main-writes
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Remove duplicate schema helper block
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/newsdesk/src/editorial.js')
          s=p.read_text(encoding='utf-8')
          marker='function schemaShapeValid(value, schema) {'
          first=s.index(marker)
          second=s.index(marker, first+1)
          ai=s.index('async function aiJson(', second)
          s=s[:second]+s[ai:]
          p.write_text(s,encoding='utf-8')
          PY
          node --check cloudflare/newsdesk/src/editorial.js
      - name: Commit cleanup
        run: |
          git config user.name 'morgentidende-maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/newsdesk/src/editorial.js
          git commit -m 'chore: deduplicate structured response validator'
          git pull --rebase origin main
          git push origin main
