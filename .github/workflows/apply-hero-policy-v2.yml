name: Apply hero policy v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hero-policy-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Sync latest main
        run: git fetch origin main && git reset --hard origin/main
      - name: Apply hero policy source patch
        run: |
          python scripts/apply_hero_policy_v2.py
          node --check cloudflare/newsdesk/src/editorial.js
          python scripts/refresh_pending_images.py --self-test
          python scripts/reapprove_media_change.py --self-test
      - name: Commit canonical source changes
        id: commit
        run: |
          git config user.name "morgentidende-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/newsdesk/src/editorial.js scripts/refresh_pending_images.py scripts/reapprove_media_change.py
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "media: lawful visuals before Flux; ban static hero fallback"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy patched Newsdesk
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh workflow run cloudflare-newsdesk-deploy.yml --ref main
      - name: Rebuild public edition with improved media scout
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh workflow run build-publish.yml --ref main
