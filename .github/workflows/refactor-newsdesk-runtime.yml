name: Refactor Newsdesk runtime

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refactor_newsdesk_runtime.py'
      - '.github/workflows/refactor-newsdesk-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --ff-only origin main
      - name: Apply Newsdesk refactor
        run: python scripts/refactor_newsdesk_runtime.py
      - name: Validate runtime
        run: |
          node --check cloudflare/newsdesk/src/editorial.js
          grep -q 'chosen.length >= 20' cloudflare/newsdesk/src/editorial.js
          grep -q 'assignmentSchema, 260' cloudflare/newsdesk/src/editorial.js
          grep -q 'deskRecheckSchema, 180' cloudflare/newsdesk/src/editorial.js
      - name: Commit runtime refactor
        run: |
          set -euo pipefail
          git config user.name 'morgentidende-newsdesk-refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/newsdesk/src/editorial.js
          git commit -m 'refactor: cheaper looser Newsdesk runtime'
          git pull --rebase origin main
          git push origin main
