name: Implement watch recheck policy once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/implement-watch-recheck-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch watch policy
        env:
          PATCH_B64: ''
        run: |
          python - <<'PY'
          import os, base64
          exec(base64.b64decode(os.environ['PATCH_B64']).decode('utf-8'))
          PY
          node --check cloudflare/newsdesk/src/index.js
          python scripts/test_hybrid_runtime.py
          git diff --check
      - name: Commit watch policy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare/newsdesk/src/index.js
          git commit -m 'feat: make Newsdesk watch stories self-rechecking' || exit 0
          git push origin main
