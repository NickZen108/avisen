name: Fix Gemini patch runner once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gemini-patcher-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix replacement escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-gemini-agreed-cleanup-v2-once.yml')
          s=p.read_text(encoding='utf-8')
          old='js, n = repair_pattern.subn(repair_replacement, js, count=1)'
          new='js, n = repair_pattern.subn(lambda _: repair_replacement, js, count=1)'
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm -f .github/workflows/apply-gemini-agreed-cleanup-once.yml
          rm -f .github/workflows/fix-gemini-patcher-once.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: fix Gemini optimization patcher'
          git push
