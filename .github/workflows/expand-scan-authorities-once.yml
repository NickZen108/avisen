name: Expand Scan authority sources once

on:
  push:
    paths:
      - '.github/workflows/expand-scan-authorities-once.yml'
      - '.github/scripts/expand_scan_authorities.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/expand_scan_authorities.py
      - name: Validate
        run: |
          node --check cloudflare/newsdesk/src/index.js
          node --check cloudflare/newsdesk/src/editorial.js
          python scripts/test_hybrid_runtime.py
          git diff --check
      - name: Commit and clean up
        run: |
          git config user.name 'morgentidende-maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/expand-scan-authorities-once.yml .github/scripts/expand_scan_authorities.py
          git add cloudflare/newsdesk/src/index.js
          git commit -m 'scan: add Reuters and Danish authority sources'
          git pull --rebase origin main
          git push origin main
