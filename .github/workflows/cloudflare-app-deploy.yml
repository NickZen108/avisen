name: Deploy Cloudflare App Runtime

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/app/**'
      - 'scripts/add_control_room_data_api.py'
      - '.github/workflows/cloudflare-app-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morgentidende-cloudflare-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply protected control-room APIs
        run: |
          python scripts/add_control_room_data_api.py
          if ! git diff --quiet -- cloudflare/app/src/index.js; then
            git config user.name 'morgentidende-app-builder'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cloudflare/app/src/index.js
            git commit -m 'feat: expose protected control room data APIs'
            git pull --rebase origin main
            git push origin main
          fi

      - name: Deploy app Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.127.1'
          command: deploy --config cloudflare/app/wrangler.toml

      - name: Smoke-test app runtime
        run: |
          set -euo pipefail
          BASE='https://morgentidende-app.nicolaipetersen108.workers.dev'
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$BASE/health" -o /tmp/health.json; then
              break
            fi
            sleep 5
          done
          jq -e '.ok == true and (.missing_config | length) == 0' /tmp/health.json >/dev/null
          curl --silent --show-error -o /tmp/me.json -w '%{http_code}' "$BASE/api/me" | grep -qx '401'
          echo 'App health:'
          jq . /tmp/health.json
