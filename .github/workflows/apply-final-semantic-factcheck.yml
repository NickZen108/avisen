name: Apply semantic fact-check patch

on:
  push:
    branches: [main]
    paths:
      - '.github/semantic-factcheck-trigger'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: |
          python scripts/apply_semantic_factcheck_once.py
          node --check cloudflare/newsdesk/src/editorial.js
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "morgentidende-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/newsdesk/src/editorial.js
          git commit -m "fix: fact checker verifies full article semantics against sources"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run cloudflare-newsdesk-deploy.yml --ref main
          gh workflow run quality-gates.yml --ref main
