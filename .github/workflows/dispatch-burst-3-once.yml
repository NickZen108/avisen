name: Dispatch burst 3 once
# Manual trigger helper refreshed 2026-09-04T06:31+02:00 — auditable burst
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-burst-3-once.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch 3-cycle burst
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run burst-3-once.yml -R NickZen108/avisen --ref main -f cycles=3
