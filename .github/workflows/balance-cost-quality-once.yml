name: Balance editorial cost and quality once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/balance-cost-quality-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/maintenance_balance_cost_quality_once.py
      - name: Validate
        run: |
          node --check cloudflare/newsdesk/src/editorial.js
          python -m py_compile scripts/sync_cloudflare_editorial.py
          python scripts/editorial_sync_contract_test.py
          git diff --check
      - name: Remove one-shot files
        run: rm scripts/maintenance_balance_cost_quality_once.py .github/workflows/balance-cost-quality-once.yml
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: balance editorial cost with final quality'
          git pull --rebase origin main
          git push origin main
