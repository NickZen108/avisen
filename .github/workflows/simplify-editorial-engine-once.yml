name: Simplify editorial engine once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplify-editorial-engine-once.yml'

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply simplification
        run: python scripts/maintenance_simplify_editorial_engine_once.py
      - name: Syntax and focused self-tests
        run: |
          node --check cloudflare/newsdesk/src/editorial.js
          python -m py_compile scripts/release_ready.py scripts/sync_cloudflare_editorial.py scripts/quality_gate.py
          python scripts/release_ready.py --self-test
          python scripts/editorial_dispatch_gate.py --self-test
          python scripts/editorial_sync_contract_test.py
          git diff --check
      - name: Remove one-shot maintenance files
        run: rm scripts/maintenance_simplify_editorial_engine_once.py .github/workflows/simplify-editorial-engine-once.yml
      - name: Commit simplification
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: simplify editorial engine ownership and retries'
          git pull --rebase origin main
          git push origin main
