name: Newsroom cycle

on:
  workflow_run:
    workflows: ["Breaking scan"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morgentidende-main-writes
  cancel-in-progress: false

jobs:
  prepare-queue:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build or preserve machine-readable candidate queue
        run: |
          if grep -q "Cloudflare runtime" scan/latest.md 2>/dev/null; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('queue/candidates.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('runtime') == 'cloudflare-workers', 'Cloudflare scan marker without Cloudflare queue'
          assert isinstance(data.get('signals'), list), 'Cloudflare queue signals missing'
          print(f"Cloudflare queue bevaret: {len(data['signals'])} signaler")
          PY
          else
            python scripts/newsroom_queue.py
          fi
      - name: Commit queue only when signals changed
        run: |
          git config user.name "morgentidende-newsroom"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/candidates.json
          if git diff --cached --quiet; then
            echo "Ingen ændring i kandidatlisten"
          else
            git commit -m "newsroom: refresh candidate queue"
            git push
          fi
