name: Build structured edition
on:
  push:
    branches: [main]
    paths: ['content/**','sources/**','reports/editorial/approvals/**','templates/**','config/**','scripts/build_all.py','scripts/build_all_v2.py','scripts/build_short_videos.py','scripts/build_control_room.py','scripts/design_enhancements.py','scripts/seo_surface_fix.py','scripts/cache_public_images.py','scripts/quality_gate.py','scripts/pipeline_v2_gate.py','scripts/readability_gate.py','scripts/prepublish_surface_qa.py','scripts/release_ready.py','.github/workflows/build-publish.yml','.github/workflows/auto-publish-merge.yml']
  workflow_run:
    workflows: ['Cloudflare editorial sync']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions: {contents: write, actions: write}
concurrency: {group: morgentidende-main-writes, cancel-in-progress: false}
jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Sync latest main
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Release approved ready articles; park incomplete ones
        run: python scripts/release_ready.py
      - name: Gates before build
        run: python scripts/quality_gate.py --prebuild && python scripts/pipeline_v2_gate.py && python scripts/readability_gate.py && python scripts/prepublish_surface_qa.py
      - name: Build
        run: python scripts/build_all_v2.py && python scripts/build_short_videos.py && python scripts/design_enhancements.py && python scripts/build_control_room.py && python scripts/seo_surface_fix.py
      - name: Cache public images locally
        run: python scripts/cache_public_images.py
      - name: Gates after build
        run: python scripts/quality_gate.py && python scripts/pipeline_v2_gate.py && python scripts/readability_gate.py && python scripts/prepublish_surface_qa.py
      - name: Commit release + recovery state + generated files
        id: publish
        run: |
          git config user.name "morgentidende-publisher"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles content/frontpage.json reports/editorial/pipeline-health.json docs/index.html docs/artikler docs/rettelser.html docs/sitemap.xml docs/news-sitemap.xml docs/robots.txt docs/kontrolrum docs/img/cache
          if git diff --cached --quiet; then echo "published=false" >> "$GITHUB_OUTPUT"; else git commit -m "publish: build structured edition"; git push; echo "published=true" >> "$GITHUB_OUTPUT"; echo "publisher_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; fi
      - name: Dispatch post-deploy guard
        if: ${{ steps.publish.outputs.published == 'true' }}
        env: {GH_TOKEN: '${{ github.token }}', PUBLISHER_SHA: '${{ steps.publish.outputs.publisher_sha }}'}
        run: gh workflow run post-deploy-guard.yml --ref main -f target_sha="$PUBLISHER_SHA"
