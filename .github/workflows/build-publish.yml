name: Build structured edition
on:
  push:
    branches: [main]
    paths: ['content/**','sources/**','reports/editorial/approvals/**','templates/**','config/**','docs/theme.js','docs/kontrolrum/control-room-tabs.js','scripts/build_all_v2.py','scripts/build_short_videos.py','scripts/build_control_room.py','scripts/apply_control_room_extras.py','scripts/pipeline_feedback.py','scripts/design_enhancements.py','scripts/reader_experience.py','scripts/article_history.py','scripts/editorial_analytics.py','scripts/production_readiness.py','scripts/queue_recovery.py','scripts/seo_surface_fix.py','scripts/cache_public_images.py','scripts/quality_gate.py','scripts/readability_gate.py','scripts/prepublish_surface_qa.py','scripts/release_ready.py','scripts/refresh_pending_images.py','scripts/normalize_categories.py','scripts/magazine_blocks.py','scripts/frontpage_publication_strategy.py','.github/workflows/build-publish.yml','.github/workflows/auto-publish-merge.yml']
  workflow_dispatch:
permissions: {contents: write, actions: write}
concurrency: {group: morgentidende-main-writes, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Sync latest main
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Normalize current categories before validation
        run: python scripts/normalize_categories.py
      - name: Gates before release
        run: python scripts/quality_gate.py --prebuild --changed-only && python scripts/readability_gate.py && python scripts/prepublish_surface_qa.py
      - name: Release approved ready articles; park incomplete ones
        run: python scripts/release_ready.py
      - name: Prefer lawful free documentary photos before final build
        run: python scripts/refresh_pending_images.py --limit 10
      - name: Validate any media/release changes
        run: python scripts/quality_gate.py --prebuild --changed-only && python scripts/prepublish_surface_qa.py
      - name: Apply frontpage publication strategy (placement only; non-gating)
        run: python scripts/frontpage_publication_strategy.py
      - name: Build public edition
        run: python scripts/build_all_v2.py && python scripts/build_short_videos.py && python scripts/design_enhancements.py && python scripts/reader_experience.py && python scripts/production_readiness.py && python scripts/seo_surface_fix.py && python scripts/magazine_blocks.py
      - name: Cache public images locally
        run: python scripts/cache_public_images.py
      - name: Validate generated output and global integrity once
        run: python scripts/quality_gate.py
      - name: Refresh diagnostics and Control Room
        continue-on-error: true
        run: |
          python scripts/article_history.py
          python scripts/editorial_analytics.py
          python scripts/queue_recovery.py
          python scripts/pipeline_feedback.py
          python scripts/build_control_room.py
          python scripts/apply_control_room_extras.py
      - name: Commit release + generated files
        id: publish
        run: |
          git config user.name "morgentidende-publisher"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles content/frontpage.json reports/editorial/approvals queue/recovery.json reports/editorial/pipeline-health.json reports/editorial/pipeline-feedback.json reports/editorial/production-readiness.json reports/editorial/article-versions.json reports/editorial/editorial-analytics.json docs/index.html docs/artikler docs/emner docs/rettelser.html docs/sitemap.xml docs/news-sitemap.xml docs/robots.txt docs/kontrolrum docs/img/cache
          if git diff --cached --quiet; then echo "published=false" >> "$GITHUB_OUTPUT"; else git commit -m "publish: build structured edition"; git push; echo "published=true" >> "$GITHUB_OUTPUT"; echo "publisher_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; fi
      - name: Dispatch post-deploy guard
        if: ${{ steps.publish.outputs.published == 'true' }}
        env: {GH_TOKEN: '${{ github.token }}', PUBLISHER_SHA: '${{ steps.publish.outputs.publisher_sha }}'}
        run: gh workflow run post-deploy-guard.yml --ref main -f target_sha="$PUBLISHER_SHA"
