name: Build Morgentidende v3 edition

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'sources/**'
      - 'state/**'
      - 'templates/**'
      - 'config/**'
      - 'scripts/build_all_v2.py'
      - 'scripts/builder_core.py'
      - 'scripts/build_short_videos.py'
      - 'scripts/design_enhancements.py'
      - 'scripts/reader_experience.py'
      - 'scripts/seo_surface_fix.py'
      - 'scripts/magazine_blocks.py'
      - 'scripts/cache_public_images.py'
      - 'scripts/normalize_categories.py'
      - 'scripts/v3_newsroom_state.py'
      - 'scripts/v3_technical_check.py'
      - '.github/workflows/build-publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: morgentidende-main-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git fetch origin main && git reset --hard origin/main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Normalize legacy category aliases
        run: python scripts/normalize_categories.py

      - name: Rebuild single newsroom state and Forside v2
        run: python scripts/v3_newsroom_state.py

      - name: Technical publication integrity only
        run: python scripts/v3_technical_check.py

      - name: Build public edition
        run: |
          python scripts/build_all_v2.py
          python scripts/build_short_videos.py
          python scripts/design_enhancements.py
          python scripts/reader_experience.py
          python scripts/seo_surface_fix.py
          python scripts/magazine_blocks.py

      - name: Cache public images locally
        run: python scripts/cache_public_images.py

      - name: Refresh diagnostics and Control Room
        continue-on-error: true
        run: |
          python scripts/article_history.py
          python scripts/editorial_analytics.py
          python scripts/queue_recovery.py
          python scripts/pipeline_feedback.py
          python scripts/build_control_room.py
          python scripts/apply_control_room_extras.py

      - name: Commit generated edition
        id: publish
        run: |
          set -euo pipefail
          git config user.name "morgentidende-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/frontpage.json content/frontpage-v2.json state/newsroom-v3.json docs
          git add reports/editorial/article-versions.json reports/editorial/editorial-analytics.json queue/recovery.json reports/editorial/pipeline-health.json reports/editorial/pipeline-feedback.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "publish: build v3 edition"
            git pull --rebase origin main
            git push origin main
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "publisher_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch production Cloudflare deploy
        if: ${{ steps.publish.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_SHA: ${{ steps.publish.outputs.publisher_sha }}
        run: gh workflow run cloudflare-deploy.yml --ref main -f target_sha="$PUBLISHER_SHA"
