name: Post-publication technical QA
on:
  schedule: [{cron: '7,22,37,52 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: morgentidende-main-writes, cancel-in-progress: false}
jobs:
  live-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Live technical QA of frontpage and recent articles
        run: python scripts/live_recent_qa.py --recent-hours 24 --report reports/qa/live-latest.md
