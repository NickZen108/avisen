name: Post-publication QA

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/live_qa.py'
      - 'scripts/live_recent_qa.py'
      - 'scripts/live_visual_qa.py'
      - 'scripts/live_surface_qa.py'
      - 'agents/live-proofreader.md'
      - '.github/workflows/post-publication-qa.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morgentidende-post-publication-qa
  cancel-in-progress: true

jobs:
  live-qa:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual verifier
        run: python -m pip install --disable-pip-version-check pillow
      - name: Live text, rendering and internal-link QA
        id: textqa
        continue-on-error: true
        run: python scripts/live_recent_qa.py --base-url https://morgentidende.nicolaipetersen108.workers.dev/ --recent-hours 24 --report reports/qa/live-latest.md
      - name: Live image and graphics QA
        id: visualqa
        continue-on-error: true
        run: python scripts/live_visual_qa.py --base-url https://morgentidende.nicolaipetersen108.workers.dev/ --recent-hours 24 --report reports/qa/live-visual-latest.md
      - name: Live responsive, dark-mode and hero QA
        id: surfaceqa
        continue-on-error: true
        run: python scripts/live_surface_qa.py --base-url https://morgentidende.nicolaipetersen108.workers.dev/ --recent-hours 24 --report reports/qa/live-surface-latest.md
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-publication-qa-${{ github.run_id }}
          path: reports/qa/*.md
          if-no-files-found: warn
          retention-days: 14
      - name: Aggregate live QA result
        if: always()
        env:
          TEXT: ${{ steps.textqa.outcome }}
          VISUAL: ${{ steps.visualqa.outcome }}
          SURFACE: ${{ steps.surfaceqa.outcome }}
        run: |
          echo "text=$TEXT visual=$VISUAL surface=$SURFACE"
          test "$TEXT" = success
          test "$VISUAL" = success
          test "$SURFACE" = success
