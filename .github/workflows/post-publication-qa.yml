name: Post-publication image QA

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/live_visual_qa.py'
      - '.github/workflows/post-publication-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morgentidende-post-publication-image-qa
  cancel-in-progress: true

jobs:
  live-image-qa:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual verifier
        run: python -m pip install --disable-pip-version-check pillow
      - name: Live image and graphics QA
        run: python scripts/live_visual_qa.py --base-url https://morgentidende.nicolaipetersen108.workers.dev/ --recent-hours 24 --report reports/qa/live-visual-latest.md
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-publication-image-qa-${{ github.run_id }}
          path: reports/qa/live-visual-latest.md
          if-no-files-found: warn
          retention-days: 14
