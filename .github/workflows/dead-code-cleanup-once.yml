name: One-shot dead-code cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dead-code-cleanup-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove verified dead code
        run: python scripts/dead_code_cleanup_once.py
      - name: Commit cleanup
        run: |
          git config user.name 'morgentidende-maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/dead-code-cleanup-once.yml scripts/dead_code_cleanup_once.py
          git add cloudflare/newsdesk/src/editorial.js
          git commit -m 'cleanup: remove unused editorial definitions'
          git push origin main
