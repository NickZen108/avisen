name: Deploy Cloudflare Newsdesk Runtime

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/newsdesk/**'
      - '.github/workflows/cloudflare-newsdesk-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morgentidende-cloudflare-newsdesk
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Newsdesk Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.127.1'
          command: deploy --config cloudflare/newsdesk/wrangler.jsonc
