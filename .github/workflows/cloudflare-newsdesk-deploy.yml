name: '[QUARANTINED] Pipeline v2 Newsdesk deploy'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline v2 runtime is frozen
        run: |
          echo 'The deployed v2 Newsdesk runtime is frozen as a reference.'
          echo 'This workflow will not deploy cloudflare/newsdesk.'
          echo 'Pipeline v3 must use a separate runtime/path.'
