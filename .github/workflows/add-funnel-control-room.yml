name: Add funnel to control room

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_funnel_to_control_room.py'
      - '.github/workflows/add-funnel-control-room.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --ff-only origin main
      - run: python scripts/add_funnel_to_control_room.py
      - run: node --check cloudflare/app/src/index.js && node --check docs/kontrolrum/control-room-tabs.js
      - name: Commit integration
        run: |
          set -euo pipefail
          if git diff --quiet -- cloudflare/app/src/index.js docs/kontrolrum/control-room-tabs.js; then exit 0; fi
          git config user.name 'morgentidende-control-room'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/app/src/index.js docs/kontrolrum/control-room-tabs.js
          git commit -m 'feat: show live editorial funnel in control room'
          git pull --rebase origin main
          git push origin main
